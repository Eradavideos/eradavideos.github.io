
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>ERADA Video Library</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      text-align: center;
      padding: 30px;
    }

    header h1 {
      margin: 0;
    }

    .header-logo {
      width: 130px;
      height: 130px;
      object-fit: contain;
      display: block;
      margin: 0 auto 10px;
      border-radius: 12px;
    }

    .container {
      max-width: 900px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 22px;
      box-shadow: 0 3px 14px #0001;
    }

    .login-box {
      max-width: 500px;
      margin: 40px auto;
    }

    .login-logo {
      width: 180px;
      height: 180px;
      object-fit: contain;
      display: block;
      margin: 0 auto 20px;
    }

    .login-title {
      text-align: center;
      margin-bottom: 10px;
    }

    .login-description {
      text-align: center;
      color: #555;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 8px;
      background: #111827;
      color: white;
      cursor: pointer;
      font-size: 16px;
      margin-top: 8px;
    }

    button:hover {
      opacity: 0.9;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    #videos {
      display: none;
    }

    /*
      PRIVATE VIDEO
      ===============================
      Videos are NOT loaded from YouTube.
      They will come from the private
      Google Drive / Edge Function.
    */

    .video {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
    }

    video {
      display: block;
      width: 100%;
      max-height: 600px;
      background: #000;
      border: 0;
    }

    .video-title {
      margin-top: 0;
      margin-bottom: 15px;
    }

    .video-info {
      color: #666;
      font-size: 14px;
      margin-top: 10px;
    }

    .logout {
      float: right;
      background: #dc2626;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #666;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #666;
    }

  </style>
</head>

<body>

<header>

  <img
    src="erada-logo.png"
    alt="ERADA Logo"
    class="header-logo"
  >

  <h1>ERADA</h1>

  <p>Private Video Library</p>

</header>


<main class="container">

  <!-- LOGIN / ACCESS -->

  <section
    id="loginBox"
    class="card login-box"
  >

    <img
      src="erada-logo.png"
      alt="ERADA Logo"
      class="login-logo"
    >

    <h2 class="login-title">
      🔐 ERADA Secure Access
    </h2>

    <p class="login-description">
      Enter your approved email address.
    </p>


    <div id="emailStep">

      <input
        id="email"
        type="email"
        placeholder="Enter your email"
        autocomplete="email"
      >

      <button id="requestAccess">
        Request Access
      </button>

      <button
        id="checkAccess"
        type="button"
      >
        Check Access
      </button>

    </div>


    <div
      id="message"
      class="message"
    ></div>

  </section>


  <!-- VIDEOS -->

  <section id="videos">

    <button
      id="logout"
      class="logout"
    >
      Logout
    </button>

    <div style="clear:both"></div>

    <div
      id="videosList"
      style="margin-top:20px"
    ></div>

  </section>

</main>


<footer>
  ERADA Private Video Library
</footer>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
  "https://laqwnqnnqtfhqfadjyvo.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_ropVS738K5BJiOoaZ-TeWA_WmkineZh";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY,
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    }
  );


/* =========================================
   EDGE FUNCTION URL
========================================= */

const VIDEO_FUNCTION_URL =
  SUPABASE_URL +
  "/functions/v1/list-private-videos";


/* =========================================
   ELEMENTS
========================================= */

const emailInput =
  document.getElementById("email");

const loginBox =
  document.getElementById("loginBox");

const videos =
  document.getElementById("videos");

const message =
  document.getElementById("message");

const videosList =
  document.getElementById("videosList");


/* =========================================
   MESSAGE
========================================= */

function showMessage(text, type) {

  message.textContent =
    text;

  message.className =
    "message " + type;

  message.style.display =
    "block";

}


/* =========================================
   REQUEST ACCESS
========================================= */

document
  .getElementById("requestAccess")
  .addEventListener(
    "click",
    async function () {

      const email =
        emailInput.value
          .trim()
          .toLowerCase();


      if (
        !email ||
        !email.includes("@")
      ) {

        showMessage(
          "Please enter a valid email address.",
          "error"
        );

        return;
      }


      showMessage(
        "Sending access request...",
        "success"
      );


      const {
        error
      } =
        await supabaseClient
          .from("access_requests")
          .insert({
            email: email
          });


      if (error) {

        console.error(
          "Access request error:",
          error
        );


        if (
          error.code ===
          "23505"
        ) {

          showMessage(
            "An access request already exists for this email.",
            "error"
          );

        } else {

          showMessage(
            "Unable to submit access request.",
            "error"
          );

        }

        return;
      }


      showMessage(
        "Your access request has been sent. Please wait for approval.",
        "success"
      );

    }
  );


/* =========================================
   CHECK ACCESS
========================================= */

document
  .getElementById("checkAccess")
  .addEventListener(
    "click",
    async function () {

      const email =
        emailInput.value
          .trim()
          .toLowerCase();


      if (
        !email ||
        !email.includes("@")
      ) {

        showMessage(
          "Please enter your email address.",
          "error"
        );

        return;
      }


      showMessage(
        "Checking access...",
        "success"
      );


      const {
        data: approved,
        error
      } =
        await supabaseClient
          .from("approved_users")
          .select(
            "id,email,status"
          )
          .ilike(
            "email",
            email
          )
          .eq(
            "status",
            "approved"
          )
          .maybeSingle();


      if (error) {

        console.error(
          "Approval error:",
          error
        );


        showMessage(
          "Unable to check your access.",
          "error"
        );

        return;
      }


      if (!approved) {

        showMessage(
          "Your email has not been approved yet.",
          "error"
        );

        return;
      }


      /*
        Save approved email locally.
        This is only for remembering
        the browser state.
      */

      localStorage.setItem(
        "eradaApprovedEmail",
        email
      );


      showMessage(
        "Access approved. Loading private videos...",
        "success"
      );


      await loadPrivateVideos(
        email
      );

    }
  );


/* =========================================
   LOAD PRIVATE VIDEOS
========================================= */

async function loadPrivateVideos(
  email
) {

  videosList.innerHTML =
    "<p>Loading private videos...</p>";


  /*
    Get current Supabase session.
  */

  const {
    data: {
      session
    }
  } =
    await supabaseClient
      .auth
      .getSession();


  /*
    The Edge Function currently
    requires a valid Supabase session.
  */

  if (!session) {

    showMessage(
      "A secure session is required. We will complete the login connection in the next step.",
      "error"
    );

    return;
  }


  const response =
    await fetch(
      VIDEO_FUNCTION_URL,
      {
        method: "GET",

        headers: {
          "Authorization":
            "Bearer " +
            session.access_token,

          "apikey":
            SUPABASE_PUBLISHABLE_KEY
        }
      }
    );


  const result =
    await response.json();


  console.log(
    "Private video response:",
    result
  );


  if (
    !response.ok ||
    !result.success
  ) {

    console.error(
      "Private video error:",
      result
    );


    showMessage(
      result.error ||
      "Unable to load private videos.",
      "error"
    );

    return;
  }


  /*
    Hide login
  */

  loginBox.style.display =
    "none";

  videos.style.display =
    "block";


  renderPrivateVideos(
    result.files || []
  );

}


/* =========================================
   RENDER PRIVATE VIDEOS
========================================= */

function renderPrivateVideos(
  files
) {

  videosList.innerHTML =
    "";


  if (
    !files ||
    files.length === 0
  ) {

    videosList.innerHTML =
      `
        <div class="card empty">
          <h2>No videos available</h2>
          <p>There are currently no videos in the private library.</p>
        </div>
      `;

    return;
  }


  files.forEach(
    function(file) {

      /*
        Only display actual video files.
      */

      if (
        !file.mimeType ||
        !file.mimeType.startsWith(
          "video/"
        )
      ) {

        return;
      }


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "card";


      const title =
        document.createElement(
          "h2"
        );


      title.className =
        "video-title";


      title.textContent =
        file.name;


      /*
        VIDEO CONTAINER
      */

      const videoContainer =
        document.createElement(
          "div"
        );


      videoContainer.className =
        "video";


      /*
        IMPORTANT:
        We DO NOT use Google Drive
        public link here.

        The actual protected stream
        will be connected through
        our Edge Function.
      */

      const videoElement =
        document.createElement(
          "video"
        );


      videoElement.controls =
        true;


      videoElement.controlsList =
        "nodownload";


      videoElement.disablePictureInPicture =
        true;


      videoElement.setAttribute(
        "playsinline",
        ""
      );


      videoElement.setAttribute(
        "preload",
        "metadata"
      );


      /*
        The source will be added
        after the streaming endpoint
        is completed.
      */


      videoContainer.appendChild(
        videoElement
      );


      const info =
        document.createElement(
          "div"
        );


      info.className =
        "video-info";


      info.textContent =
        "🔒 Private ERADA Video";


      card.appendChild(
        title
      );


      card.appendChild(
        videoContainer
      );


      card.appendChild(
        info
      );


      videosList.appendChild(
        card
      );

    }
  );

}


/* =========================================
   RESTORE APPROVED EMAIL
========================================= */

function restoreApprovedEmail() {

  const savedEmail =
    localStorage.getItem(
      "eradaApprovedEmail"
    );


  if (
    savedEmail
  ) {

    emailInput.value =
      savedEmail;

  }

}


restoreApprovedEmail();


/* =========================================
   LOGOUT
========================================= */

document
  .getElementById("logout")
  .addEventListener(
    "click",
    async function () {

      /*
        Sign out Supabase
      */

      await supabaseClient
        .auth
        .signOut();


      /*
        Remove local access
      */

      localStorage.removeItem(
        "eradaApprovedEmail"
      );


      videos.style.display =
        "none";


      loginBox.style.display =
        "block";


      videosList.innerHTML =
        "";


      showMessage(
        "You have been logged out.",
        "success"
      );

    }
  );


/* =========================================
   PROTECTION
========================================= */

document.addEventListener(
  "contextmenu",
  function(event) {

    if (
      event.target.closest(
        ".video"
      )
    ) {

      event.preventDefault();

    }

  }
);


document.addEventListener(
  "dragstart",
  function(event) {

    if (
      event.target.closest(
        ".video"
      )
    ) {

      event.preventDefault();

    }

  }
);


/* =========================================
   DISABLE COMMON VIDEO SHORTCUTS
========================================= */

document.addEventListener(
  "keydown",
  function(event) {

    /*
      Prevent Ctrl+S
    */

    if (
      event.ctrlKey &&
      event.key.toLowerCase() === "s"
    ) {

      event.preventDefault();

    }


    /*
      Prevent Ctrl+U
    */

    if (
      event.ctrlKey &&
      event.key.toLowerCase() === "u"
    ) {

      event.preventDefault();

    }

  }
);

</script>

</body>
</html>
```
