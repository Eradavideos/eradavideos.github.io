<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>ERADA Video Library</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      text-align: center;
      padding: 30px;
    }

    header h1 {
      margin: 0;
    }

    .header-logo {
      width: 130px;
      height: 130px;
      object-fit: contain;
      display: block;
      margin: 0 auto 10px;
      border-radius: 12px;
    }

    .container {
      max-width: 900px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 22px;
      box-shadow: 0 3px 14px #0001;
    }

    .login-box {
      max-width: 500px;
      margin: 40px auto;
    }

    .login-logo {
      width: 180px;
      height: 180px;
      object-fit: contain;
      display: block;
      margin: 0 auto 20px;
    }

    .login-title {
      text-align: center;
      margin-bottom: 10px;
    }

    .login-description {
      text-align: center;
      color: #555;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 8px;
      background: #111827;
      color: white;
      cursor: pointer;
      font-size: 16px;
      margin-top: 8px;
    }

    button:hover {
      opacity: 0.9;
    }

    .secondary {
      background: #6b7280;
      margin-left: 5px;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    #videos {
      display: none;
    }

    .video {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 10px;
      background: #000;
    }

    iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .watch {
      display: inline-block;
      margin-top: 15px;
      padding: 11px 18px;
      background: #111827;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }

    .logout {
      float: right;
      background: #dc2626;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #666;
    }

  </style>
</head>

<body>

<header>

  <img
    src="erada-logo.png"
    alt="ERADA Logo"
    class="header-logo"
  >

  <h1>ERADA</h1>

  <p>Video Library</p>

</header>


<main class="container">

  <!-- LOGIN -->

  <section
    id="loginBox"
    class="card login-box"
  >

    <img
      src="erada-logo.png"
      alt="ERADA Logo"
      class="login-logo"
    >

    <h2 class="login-title">
      🔐 Secure Access
    </h2>

    <p class="login-description">
      Enter your email to receive a verification code.
    </p>


    <!-- Email -->

    <div id="emailStep">

      <input
        id="email"
        type="email"
        placeholder="Enter your email"
        autocomplete="email"
      >

      <button id="sendOtp">
        Send Verification Code
      </button>

      <button
        id="requestAccess"
        type="button"
      >
        Request Access
      </button>

      <p id="accessMessage"></p>

    </div>


    <!-- OTP -->

    <div
      id="otpStep"
      style="display:none"
    >

      <p>
        A verification code was sent to your email.
      </p>

      <input
        id="otp"
        type="text"
        inputmode="numeric"
        maxlength="6"
        placeholder="Enter 6-digit code"
        autocomplete="one-time-code"
      >

      <button id="verifyOtp">
        Verify Code
      </button>

      <button
        id="backToEmail"
        class="secondary"
      >
        Change Email
      </button>

    </div>


    <div
      id="message"
      class="message"
    ></div>

  </section>


  <!-- VIDEOS -->

  <section id="videos">

    <button
      id="logout"
      class="logout"
    >
      Logout
    </button>

    <div style="clear:both"></div>

    <div id="videosList"></div>

  </section>

</main>


<footer>
  ERADA Video Library
</footer>


<script>


/* =========================================
   SUPABASE SETTINGS
========================================= */

const SUPABASE_URL =
  "https://laqwnqnnqtfhqfadjyvo.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_ropVS738K5BJiOoaZ-TeWA_WmkineZh";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY,
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    }
  );


/* =========================================
   ELEMENTS
========================================= */

const emailInput =
  document.getElementById("email");

const otpInput =
  document.getElementById("otp");

const emailStep =
  document.getElementById("emailStep");

const otpStep =
  document.getElementById("otpStep");

const loginBox =
  document.getElementById("loginBox");

const videos =
  document.getElementById("videos");

const message =
  document.getElementById("message");


/* =========================================
   MESSAGE
========================================= */

function showMessage(text, type) {

  message.textContent = text;

  message.className =
    "message " + type;

  message.style.display =
    "block";

}


/* =========================================
   SEND OTP
========================================= */

document
  .getElementById("sendOtp")
  .addEventListener(
    "click",
    async function () {

      const email =
        emailInput.value
          .trim()
          .toLowerCase();


      if (
        !email ||
        !email.includes("@")
      ) {

        showMessage(
          "Please enter a valid email address.",
          "error"
        );

        return;
      }


      showMessage(
        "Sending verification code...",
        "success"
      );


      const { error } =
        await supabaseClient
          .auth
          .signInWithOtp({

            email: email,

            options: {
              shouldCreateUser: true
            }

          });


      if (error) {

        showMessage(
          error.message,
          "error"
        );

        return;
      }


      emailStep.style.display =
        "none";

      otpStep.style.display =
        "block";


      showMessage(
        "A verification code was sent to your email.",
        "success"
      );

    }
  );


/* =========================================
   VERIFY OTP
========================================= */

document
  .getElementById("verifyOtp")
  .addEventListener(
    "click",
    async function () {

      const email =
        emailInput.value
          .trim()
          .toLowerCase();


      const token =
        otpInput.value.trim();


      if (
        !email ||
        !token
      ) {

        showMessage(
          "Enter the verification code.",
          "error"
        );

        return;
      }


      showMessage(
        "Verifying...",
        "success"
      );


      const {
        data,
        error
      } =
        await supabaseClient
          .auth
          .verifyOtp({

            email: email,

            token: token,

            type: "email"

          });


      if (error) {

        showMessage(
          "Invalid or expired verification code.",
          "error"
        );

        return;
      }


      const authenticatedEmail =
        data.user?.email
          ? data.user.email
              .trim()
              .toLowerCase()
          : email;


      /* =====================================
         CHECK APPROVED USERS
      ===================================== */

      const {
        data: approved,
        error: approvedError
      } =
        await supabaseClient
          .from("approved_users")
          .select("id,status")
          .ilike(
            "email",
            authenticatedEmail
          )
          .eq(
            "status",
            "approved"
          )
          .maybeSingle();


      if (approvedError) {

        await supabaseClient
          .auth
          .signOut();


        showMessage(
          "Unable to check access permission.",
          "error"
        );

        return;
      }


      /* =====================================
         NOT APPROVED
      ===================================== */

      if (!approved) {

        await supabaseClient
          .auth
          .signOut();


        showMessage(
          "Your email is verified, but it has not been approved for ERADA Video Library.",
          "error"
        );

        return;
      }


      /* =====================================
         APPROVED
      ===================================== */

      loginBox.style.display =
        "none";

      videos.style.display =
        "block";


      await loadVideos();

    }
  );


/* =========================================
   CHANGE EMAIL
========================================= */

document
  .getElementById("backToEmail")
  .addEventListener(
    "click",
    function () {

      otpStep.style.display =
        "none";

      emailStep.style.display =
        "block";

      otpInput.value =
        "";

      message.style.display =
        "none";

    }
  );


/* =========================================
   LOAD VIDEOS
========================================= */

async function loadVideos() {

  const videosList =
    document.getElementById(
      "videosList"
    );


  videosList.innerHTML =
    "<p>Loading videos...</p>";


  const {
    data,
    error
  } =
    await supabaseClient
      .from("videos")
      .select(
        "id,title,youtube_url,created_at"
      )
      .order(
        "created_at",
        {
          ascending: true
        }
      );


  if (error) {

    console.error(
      "Unable to load videos:",
      error
    );


    videosList.innerHTML =
      "<p>Unable to load videos.</p>";


    return;
  }


  if (
    !data ||
    data.length === 0
  ) {

    videosList.innerHTML =
      "<p>No videos available.</p>";

    return;
  }


  videosList.innerHTML =
    "";


  data.forEach(
    function(video) {


      const youtubeId =
        getYouTubeVideoId(
          video.youtube_url
        );


      if (!youtubeId) {

        console.error(
          "Invalid YouTube URL:",
          video.youtube_url
        );

        return;
      }


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "card";


      const title =
        document.createElement(
          "h2"
        );


      title.textContent =
        video.title;


      const videoContainer =
        document.createElement(
          "div"
        );


      videoContainer.className =
        "video";


      const iframe =
        document.createElement(
          "iframe"
        );


      iframe.src =
        "https://www.youtube.com/embed/" +
        youtubeId;


      iframe.title =
        video.title;


      iframe.allowFullscreen =
        true;


      videoContainer.appendChild(
        iframe
      );


      const watch =
        document.createElement(
          "a"
        );


      watch.className =
        "watch";


      watch.href =
        video.youtube_url;


      watch.target =
        "_blank";


      watch.rel =
        "noopener noreferrer";


      watch.textContent =
        "Watch Video";


      card.appendChild(
        title
      );


      card.appendChild(
        videoContainer
      );


      card.appendChild(
        watch
      );


      videosList.appendChild(
        card
      );

    }
  );

}


/* =========================================
   GET YOUTUBE VIDEO ID
========================================= */

function getYouTubeVideoId(
  urlString
) {

  if (!urlString) {
    return null;
  }


  try {

    const url =
      new URL(
        urlString
      );


    const hostname =
      url.hostname
        .toLowerCase()
        .replace(
          "www.",
          ""
        );


    /* youtu.be */

    if (
      hostname ===
      "youtu.be"
    ) {

      return (
        url.pathname
          .split("/")
          .filter(Boolean)[0]
        || null
      );

    }


    /* youtube.com */

    if (
      hostname ===
        "youtube.com" ||
      hostname ===
        "m.youtube.com"
    ) {


      /* Normal watch URL */

      const videoId =
        url.searchParams.get(
          "v"
        );


      if (videoId) {

        return videoId;

      }


      /* /embed/VIDEO_ID */

      if (
        url.pathname
          .startsWith(
            "/embed/"
          )
      ) {

        return url.pathname
          .split("/embed/")[1]
          ?.split("/")[0]
          || null;

      }


      /* /shorts/VIDEO_ID */

      if (
        url.pathname
          .startsWith(
            "/shorts/"
          )
      ) {

        return url.pathname
          .split("/shorts/")[1]
          ?.split("/")[0]
          || null;

      }

    }


    return null;


  } catch (error) {

    console.error(
      "Invalid YouTube URL:",
      urlString
    );

    return null;

  }

}


/* =========================================
   RESTORE LOGIN SESSION
========================================= */

async function restoreSession() {

  const {
    data: {
      session
    }
  } =
    await supabaseClient
      .auth
      .getSession();


  /* No saved login */

  if (!session) {

    loginBox.style.display =
      "block";

    videos.style.display =
      "none";

    return;
  }


  /* Get logged-in email */

  const authenticatedEmail =
    session.user?.email
      ? session.user.email
          .trim()
          .toLowerCase()
      : "";


  /* No email */

  if (!authenticatedEmail) {

    await supabaseClient
      .auth
      .signOut();


    loginBox.style.display =
      "block";

    videos.style.display =
      "none";

    return;
  }


  /* Check if user is still approved */

  const {
    data: approved,
    error: approvedError
  } =
    await supabaseClient
      .from("approved_users")
      .select(
        "id,status"
      )
      .ilike(
        "email",
        authenticatedEmail
      )
      .eq(
        "status",
        "approved"
      )
      .maybeSingle();


  /* Error checking approval */

  if (approvedError) {

    console.error(
      "Approval check error:",
      approvedError
    );

    return;
  }


  /* User is no longer approved */

  if (!approved) {

    await supabaseClient
      .auth
      .signOut();


    loginBox.style.display =
      "block";

    videos.style.display =
      "none";


    showMessage(
      "Your access has been removed.",
      "error"
    );

    return;
  }


  /* Approved user */

  loginBox.style.display =
    "none";

  videos.style.display =
    "block";


  await loadVideos();

}


/* =========================================
   CHECK SAVED SESSION
========================================= */

restoreSession();


/* =========================================
   LOGOUT
========================================= */

document
  .getElementById("logout")
  .addEventListener(
    "click",
    async function () {

      await supabaseClient
        .auth
        .signOut();


      videos.style.display =
        "none";

      loginBox.style.display =
        "block";


      otpStep.style.display =
        "none";

      emailStep.style.display =
        "block";


      otpInput.value =
        "";


      showMessage(
        "You have been logged out.",
        "success"
      );

    }
  );


/* =========================================
   REQUEST ACCESS
========================================= */

document
  .getElementById("requestAccess")
  .addEventListener(
    "click",
    async function () {

      const email =
        emailInput.value
          .trim()
          .toLowerCase();


      if (
        !email ||
        !email.includes("@")
      ) {

        showMessage(
          "Please enter a valid email address.",
          "error"
        );

        return;
      }


      const {
        error
      } =
        await supabaseClient
          .from("access_requests")
          .insert({

            email: email

          });


      if (error) {

        if (
          error.code ===
          "23505"
        ) {

          showMessage(
            "An access request already exists for this email.",
            "error"
          );

        } else {

          console.error(
            error
          );


          showMessage(
            "Unable to submit access request.",
            "error"
          );

        }

        return;
      }


      showMessage(
        "Your access request has been sent. Please wait for approval.",
        "success"
      );

    }
  );


</script>

</body>
</html>
