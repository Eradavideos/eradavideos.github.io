/* =========================================

function escapeHtml(text) {

  return String(text ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function showMessage(
  element,
  text,
  type
) {

  element.innerHTML =
    `<div class="message ${type}">
      ${escapeHtml(text)}
    </div>`;

}

/* =========================================
   CHECK ADMIN
========================================= */

async function checkAdminUser(email) {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("admin_users")
      .select("id,email")
      .ilike(
        "email",
        email
      )
      .maybeSingle();

  if (error) {

    console.error(
      "Admin check error:",
      error
    );

    return false;
  }

  return !!data;
}


/* =========================================
   LOGIN
========================================= */

document
  .getElementById("adminLogin")
  .addEventListener(
    "click",
    async function() {

      const email =
        adminEmail.value
          .trim()
          .toLowerCase();

      const password =
        adminPassword.value;


      if (email !== ADMIN_EMAIL) {

        showMessage(
          loginMessage,
          "Only IT@erada.ly can access the admin panel.",
          "error"
        );

        return;
      }


      if (!password) {

        showMessage(
          loginMessage,
          "Please enter your password.",
          "error"
        );

        return;
      }


      showMessage(
        loginMessage,
        "Signing in...",
        "success"
      );


      const {
        data,
        error
      } =
        await supabaseClient
          .auth
          .signInWithPassword({
            email,
            password
          });


      if (error) {

        console.error(
          "Login error:",
          error
        );

        showMessage(
          loginMessage,
          "Invalid email or password.",
          "error"
        );

        return;
      }


      const authenticatedEmail =
        data.user?.email
          ?.trim()
          .toLowerCase();


      if (
        authenticatedEmail !==
        ADMIN_EMAIL
      ) {

        await supabaseClient
          .auth
          .signOut();

        showMessage(
          loginMessage,
          "Only IT@erada.ly can access the admin panel.",
          "error"
        );

        return;
      }


      const isAdmin =
        await checkAdminUser(
          authenticatedEmail
        );


      if (!isAdmin) {

        await supabaseClient
          .auth
          .signOut();

        showMessage(
          loginMessage,
          "You are not authorized to access the admin panel.",
          "error"
        );

        return;
      }


      adminPassword.value = "";


      currentAdmin.textContent =
        authenticatedEmail;


      loginBox.classList.add(
        "hidden"
      );

      adminPanel.classList.remove(
        "hidden"
      );


      await loadFolders();

      await loadVideos();

      await loadApprovedUsers();

      await loadRequests();

    }
  );

        );

        return;

      folderName.value =

/* =========================================
   LOAD FOLDERS
========================================= */

async function loadFolders() {

  foldersList.innerHTML =
    "Loading...";


  const {
    data: folders,
    error
  } =
    await supabaseClient
      .from("folders")
      .select(
        "id,name,created_at"
      )
      .order(
        "created_at",
        {
          ascending: true
        }
      );


  if (error) {

    console.error(
      "Folders error:",
      error
    );

    foldersList.innerHTML =
      `<div class="message error">
        ${escapeHtml(error.message)}
      </div>`;

    return;
  }


  videoFolder.innerHTML =
    `<option value="">
      -- Select Folder --
    </option>`;


  if (
    !folders ||
    folders.length === 0
  ) {

    foldersList.innerHTML =
      "<p style='color:var(--muted)'>No folders created yet.</p>";

    return;
  }


  for (
    const folder
    of folders
  ) {

    const {
      count
    } =
      await getFolderVideoCount(
        folder.id
      );


    const div =
      document.createElement(
        "div"
      );


    div.className =
      "folder";


    div.innerHTML = `

      <div class="folder-name">
        📁 ${escapeHtml(folder.name)}
      </div>

      <div class="folder-count">
        ${count} video${count === 1 ? "" : "s"}
      </div>

      <div class="actions">

        <button
          data-rename-folder="${escapeHtml(folder.id)}"
        >
          ✏️ Rename
        </button>

        <button
          class="danger"
          data-delete-folder="${escapeHtml(folder.id)}"
        >
          🗑️ Delete
        </button>

      </div>

    `;


    foldersList.appendChild(
      div
    );


    const option =
      document.createElement(
        "option"
      );


    option.value =
      folder.id;

    option.textContent =
      folder.name;


    videoFolder.appendChild(
      option
    );

  }


  foldersList
    .querySelectorAll(
      "[data-rename-folder]"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          function() {

            renameFolder(
              button.dataset.renameFolder
            );

          }
        );

      }
    );


  foldersList
    .querySelectorAll(
      "[data-delete-folder]"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          function() {

            deleteFolder(
              button.dataset.deleteFolder
            );

          }
        );

      }
    );

}


/* =========================================
   FOLDER COUNT
========================================= */

async function getFolderVideoCount(
  folderId
) {

  const {
    count
  } =
    await supabaseClient
      .from("videos")
      .select(
        "id",
        {
          count:
            "exact",
          head:
            true
        }
      )
      .eq(
        "folder_id",
        folderId
      );


  return {
    count:
      count || 0
  };

}


/* =========================================
   RENAME FOLDER
========================================= */

async function renameFolder(
  id
) {

  const {
    data: folder,
    error
  } =
    await supabaseClient
      .from("folders")
      .select("name")
      .eq(
        "id",
        id
      )
      .single();


  if (error) {

    alert(
      "Unable to load folder."
    );

    return;
  }


  const newName =
    prompt(
      "Enter the new folder name:",
      folder.name
    );


  if (
    newName === null
  ) {
    return;
  }


  const name =
    newName.trim();


  if (!name) {

    alert(
      "Folder name cannot be empty."
    );

    return;
  }


  const {
    error: updateError
  } =
    await supabaseClient
      .from("folders")
      .update({
        name
      })
      .eq(
        "id",
        id
      );


  if (updateError) {

    console.error(
      updateError
    );

    alert(
      "Unable to rename folder."
    );

    return;
  }


  await loadFolders();

}


/* =========================================
   DELETE FOLDER
========================================= */

async function deleteFolder(
  id
) {

  const {
    count
  } =
    await getFolderVideoCount(
      id
    );


  let message =
    "Delete this folder?";


  if (count > 0) {

    message =
      `This folder contains ${count} video(s).\n\nDeleting it will move those videos to "No Folder".\n\nContinue?`;

  }


  if (
    !confirm(message)
  ) {
    return;
  }


  const {
    error
  } =
    await supabaseClient
      .from("folders")
      .delete()
      .eq(
        "id",
        id
      );


  if (error) {

    console.error(
      "Delete folder error:",
      error
    );

    alert(
      "Unable to delete folder."
    );

    return;
  }


  await loadFolders();

  await loadVideos();

}

        !extractYoutubeId(url)
      ) {

        showMessage(
          videoMessage,
          "Please enter a valid YouTube link.",
          "error"
        );

        return;
      }


      const {
        error
      } =
        await supabaseClient
          .from("videos")
          .insert({

            title,

            youtube_url:
              url,

            folder_id:
              folderId

          });


      if (error) {

        console.error(
          "Add video error:",
          error
        );

        showMessage(
          videoMessage,
          error.message,
          "error"
        );

        return;
      }


      videoTitle.value =
        "";

      videoUrl.value =
        "";

      videoFolder.value =
        "";


      showMessage(
        videoMessage,
        "Video added successfully.",
        "success"
      );


      await loadFolders();

      await loadVideos();

    }
  );


/* =========================================
   EXTRACT YOUTUBE ID
========================================= */

function extractYoutubeId(
  url
) {

  if (!url) {
    return null;
  }


  const patterns = [

    /youtu\.be\/([a-zA-Z0-9_-]{6,})/,

    /[?&]v=([a-zA-Z0-9_-]{6,})/,

    /embed\/([a-zA-Z0-9_-]{6,})/,

    /youtube\.com\/shorts\/([a-zA-Z0-9_-]{6,})/

  ];


  for (
    const pattern
    of patterns
  ) {

    const match =
      url.match(
        pattern
      );


    if (
      match
    ) {

      return match[1];

    }

  }


  return null;
}

async function editVideo(
  id
) {

  const {
    data: video,
    error
  } =
    await supabaseClient
      .from("videos")
      .select(
        "title,youtube_url"
      )
      .eq(
        "id",
        id
      )
      .single();


  if (error) {

    alert(
      "Unable to load video."
    );

    return;
  }


  const newTitle =
    prompt(
      "Enter video title:",
      video.title
    );


  if (
    newTitle === null
  ) {
    return;
  }


  const newUrl =
    prompt(
      "Enter YouTube link:",
      video.youtube_url
    );


  if (
    newUrl === null
  ) {
    return;
  }


  if (
    !extractYoutubeId(
      newUrl.trim()
    )
  ) {

    alert(
      "Invalid YouTube link."
    );

    return;
  }


  const {
    error: updateError
  } =
    await supabaseClient
      .from("videos")
      .update({

        title:
          newTitle.trim(),

        youtube_url:
          newUrl.trim()

      })
      .eq(
        "id",
        id
      );


  if (updateError) {

    console.error(
      updateError
    );

    alert(
      "Unable to update video."
    );

    return;
  }


  alert(
    "Video updated successfully."
  );


  await loadVideos();

}


/* =========================================
   MOVE VIDEO
========================================= */

async function moveVideo(
  id
) {

  const {
    data: folders,
    error
  } =
    await supabaseClient
      .from("folders")
      .select(
        "id,name"
      )
      .order(
        "name",
        {
          ascending: true
        }
      );


  if (error) {

    alert(
      "Unable to load folders."
    );

    return;
  }


  if (
    !folders ||
    folders.length === 0
  ) {

    alert(
      "Create a folder first."
    );

    return;
  }


  let text =
    "Choose folder number:\n\n";


  folders.forEach(
    (
      folder,
      index
    ) => {

      text +=
        `${index + 1}. ${folder.name}\n`;

    }
  );


  const answer =
    prompt(text);


  if (
    answer === null
  ) {
    return;
  }


  const number =
    parseInt(
      answer,
      10
    );


  if (
    isNaN(number) ||
    number < 1 ||
    number > folders.length
  ) {

    alert(
      "Invalid folder number."
    );

    return;
  }


  const folderId =
    folders[number - 1].id;


  const {
    error: updateError
  } =
    await supabaseClient
      .from("videos")
      .update({
        folder_id:
          folderId
      })
      .eq(
        "id",
        id
      );


  if (updateError) {

    console.error(
      updateError
    );

    alert(
      "Unable to move video."
    );

    return;
  }


  await loadVideos();

  await loadFolders();

}
