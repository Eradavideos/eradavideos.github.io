<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>ERADA Video Library</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      text-align: center;
      padding: 30px;
    }

    header h1 {
      margin: 0;
    }

    .header-logo {
      width: 130px;
      height: 130px;
      object-fit: contain;
      display: block;
      margin: 0 auto 10px;
      border-radius: 12px;
    }

    .container {
      max-width: 900px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 22px;
      box-shadow: 0 3px 14px #0001;
    }

    .login-box {
      max-width: 500px;
      margin: 40px auto;
    }

    .login-logo {
      width: 180px;
      height: 180px;
      object-fit: contain;
      display: block;
      margin: 0 auto 20px;
    }

    .login-title {
      text-align: center;
      margin-bottom: 10px;
    }

    .login-description {
      text-align: center;
      color: #555;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 8px;
      background: #111827;
      color: white;
      cursor: pointer;
      font-size: 16px;
      margin-top: 8px;
    }

    button:hover {
      opacity: 0.9;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    #videos {
      display: none;
    }

    .video {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* نسبة 16:9 */
      background: #000;
      border-radius: 10px;
      overflow: hidden;
    }

    .video iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .video-title {
      margin-top: 0;
      margin-bottom: 15px;
    }

    .video-info {
      color: #666;
      font-size: 14px;
      margin-top: 10px;
    }

    .logout {
      float: right;
      background: #dc2626;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #666;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #666;
    }

  </style>

</head>


<body>


<header>

  <img
    src="erada-logo.png"
    alt="ERADA Logo"
    class="header-logo"
  >

  <h1>ERADA</h1>

  <p>Private Video Library</p>

</header>


<main class="container">


  <!-- =========================================
       LOGIN / ACCESS
  ========================================== -->

  <section
    id="loginBox"
    class="card login-box"
  >

    <img
      src="erada-logo.png"
      alt="ERADA Logo"
      class="login-logo"
    >

    <h2 class="login-title">
      🔐 ERADA Secure Access
    </h2>

    <p class="login-description">
      Enter your approved email address.
    </p>


    <div id="emailStep">

      <input
        id="email"
        type="email"
        placeholder="Enter your email"
        autocomplete="email"
      >


      <button id="requestAccess">
        Request Access
      </button>


      <button
        id="checkAccess"
        type="button"
      >
        Check Access
      </button>

    </div>


    <div
      id="message"
      class="message"
    ></div>

  </section>


  <!-- =========================================
       VIDEOS
  ========================================== -->

  <section id="videos">

    <button
      id="logout"
      class="logout"
    >
      Logout
    </button>

    <div style="clear:both"></div>

    <div
      id="videosList"
      style="margin-top:20px"
    ></div>

  </section>

</main>


<footer>
  ERADA Private Video Library
</footer>


<script>


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
  "https://laqwnqnnqtfhqfadjyvo.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_ropVS738K5BJiOoaZ-TeWA_WmkineZh";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY,
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    }
  );


/* =========================================
   ELEMENTS
========================================= */

const emailInput =
  document.getElementById("email");

const loginBox =
  document.getElementById("loginBox");

const videos =
  document.getElementById("videos");

const message =
  document.getElementById("message");

const videosList =
  document.getElementById("videosList");


/* =========================================
   MESSAGE
========================================= */

function showMessage(
  text,
  type
) {

  message.textContent =
    text;

  message.className =
    "message " + type;

  message.style.display =
    "block";

}


/* =========================================
   REQUEST ACCESS
========================================= */

document
  .getElementById("requestAccess")
  .addEventListener(
    "click",
    async function () {

      const email =
        emailInput.value
          .trim()
          .toLowerCase();


      if (
        !email ||
        !email.includes("@")
      ) {

        showMessage(
          "Please enter a valid email address.",
          "error"
        );

        return;
      }


      showMessage(
        "Sending access request...",
        "success"
      );


      const {
        error
      } =
        await supabaseClient
          .from("access_requests")
          .insert({
            email: email
          });


      if (error) {

        console.error(
          "Access request error:",
          error
        );


        if (
          error.code ===
          "23505"
        ) {

          showMessage(
            "An access request already exists for this email.",
            "error"
          );

        } else {

          showMessage(
            "Unable to submit access request.",
            "error"
          );

        }

        return;
      }


      showMessage(
        "Your access request has been sent. Please wait for approval.",
        "success"
      );

    }
  );


/* =========================================
   CHECK ACCESS
========================================= */

document
  .getElementById("checkAccess")
  .addEventListener(
    "click",
    async function () {

      const email =
        emailInput.value
          .trim()
          .toLowerCase();


      if (
        !email ||
        !email.includes("@")
      ) {

        showMessage(
          "Please enter your email address.",
          "error"
        );

        return;
      }


      showMessage(
        "Checking access...",
        "success"
      );


      const {
        data: approved,
        error
      } =
        await supabaseClient
          .from("approved_users")
          .select(
            "id,email,status"
          )
          .ilike(
            "email",
            email
          )
          .eq(
            "status",
            "approved"
          )
          .maybeSingle();


      if (error) {

        console.error(
          "Approval error:",
          error
        );


        showMessage(
          "Unable to check your access.",
          "error"
        );

        return;
      }


      if (!approved) {

        showMessage(
          "Your email has not been approved yet.",
          "error"
        );

        return;
      }


      /*
        Save approved email locally.
      */

      localStorage.setItem(
        "eradaApprovedEmail",
        email
      );


      showMessage(
        "Access approved. Loading private videos...",
        "success"
      );


      await loadPrivateVideos();

    }
  );


/* =========================================
   LOAD PRIVATE VIDEOS
   (from the "videos" table, YouTube-based)
========================================= */

async function loadPrivateVideos() {

  videosList.innerHTML =
    `
      <div class="card">
        <p>Loading private videos...</p>
      </div>
    `;


  const {
    data: rows,
    error
  } =
    await supabaseClient
      .from("videos")
      .select("id,title,youtube_url")
      .order("created_at", { ascending: true });


  if (error) {

    console.error(
      "Video load error:",
      error
    );

    showMessage(
      "Unable to load private videos.",
      "error"
    );

    videosList.innerHTML =
      "";

    return;
  }


  /*
    Hide login.
  */

  loginBox.style.display =
    "none";

  videos.style.display =
    "block";


  renderPrivateVideos(
    rows || []
  );

}


/* =========================================
   EXTRACT YOUTUBE ID FROM ANY URL FORMAT
========================================= */

function extractYoutubeId(url) {

  if (!url) return null;

  const patterns = [
    /youtu\.be\/([a-zA-Z0-9_-]{6,})/,
    /[?&]v=([a-zA-Z0-9_-]{6,})/,
    /embed\/([a-zA-Z0-9_-]{6,})/
  ];

  for (const pattern of patterns) {

    const match =
      url.match(pattern);

    if (match) return match[1];

  }

  return null;

}


/* =========================================
   RENDER PRIVATE VIDEOS
========================================= */

function renderPrivateVideos(
  rows
) {

  videosList.innerHTML =
    "";


  if (
    !rows ||
    rows.length === 0
  ) {

    videosList.innerHTML =
      `
        <div class="card empty">

          <h2>
            No videos available
          </h2>

          <p>
            There are currently no videos
            in the private library.
          </p>

        </div>
      `;

    return;
  }


  rows.forEach(
    function(row) {

      const youtubeId =
        extractYoutubeId(
          row.youtube_url
        );


      if (!youtubeId) return;


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "card";


      const title =
        document.createElement(
          "h2"
        );


      title.className =
        "video-title";


      title.textContent =
        row.title || "Untitled";


      const videoContainer =
        document.createElement(
          "div"
        );


      videoContainer.className =
        "video";


      const iframe =
        document.createElement(
          "iframe"
        );


      iframe.src =
        "https://www.youtube-nocookie.com/embed/" +
        youtubeId +
        "?modestbranding=1&rel=0&controls=1&disablekb=1";


      iframe.title =
        row.title || "video";


      iframe.allow =
        "autoplay; encrypted-media";


      iframe.allowFullscreen =
        true;


      videoContainer.appendChild(
        iframe
      );


      const info =
        document.createElement(
          "div"
        );


      info.className =
        "video-info";


      info.textContent =
        "🔒 Private ERADA Video";


      card.appendChild(
        title
      );


      card.appendChild(
        videoContainer
      );


      card.appendChild(
        info
      );


      videosList.appendChild(
        card
      );

    }
  );

}


/* =========================================
   RESTORE APPROVED EMAIL
========================================= */

function restoreApprovedEmail() {

  const savedEmail =
    localStorage.getItem(
      "eradaApprovedEmail"
    );


  if (
    savedEmail
  ) {

    emailInput.value =
      savedEmail;

  }

}


restoreApprovedEmail();


/* =========================================
   LOGOUT
========================================= */

document
  .getElementById("logout")
  .addEventListener(
    "click",
    async function () {

      await supabaseClient
        .auth
        .signOut();


      localStorage.removeItem(
        "eradaApprovedEmail"
      );


      videos.style.display =
        "none";


      loginBox.style.display =
        "block";


      videosList.innerHTML =
        "";


      showMessage(
        "You have been logged out.",
        "success"
      );

    }
  );


/* =========================================
   PROTECTION
========================================= */

document.addEventListener(
  "contextmenu",
  function(event) {

    if (
      event.target.closest(
        ".video"
      )
    ) {

      event.preventDefault();

    }

  }
);


document.addEventListener(
  "dragstart",
  function(event) {

    if (
      event.target.closest(
        ".video"
      )
    ) {

      event.preventDefault();

    }

  }
);


/* =========================================
   DISABLE COMMON SHORTCUTS
========================================= */

document.addEventListener(
  "keydown",
  function(event) {

    /*
      Prevent Ctrl+S
    */

    if (
      event.ctrlKey &&
      event.key.toLowerCase() === "s"
    ) {

      event.preventDefault();

    }


    /*
      Prevent Ctrl+U
    */

    if (
      event.ctrlKey &&
      event.key.toLowerCase() === "u"
    ) {

      event.preventDefault();

    }

  }
);

</script>

</body>

</html>
 "switch to youtube videos"
