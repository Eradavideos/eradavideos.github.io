<script>
/* =====================================================
   ERADA VIDEO LIBRARY
   ACCESS BY APPROVED EMAIL
   DESKTOP + MOBILE
===================================================== */

"use strict";

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://laqwnqnnqtfhqfadjyvo.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_ropVS738K5BJiOoaZ-TeWA_WmkineZh";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =====================================================
   ELEMENTS
===================================================== */

const emailInput =
  document.getElementById("email");

const loginBox =
  document.getElementById("loginBox");

const videos =
  document.getElementById("videos");

const messageBox =
  document.getElementById("message");

const videosList =
  document.getElementById("videosList");

const requestAccessButton =
  document.getElementById("requestAccess");

const checkAccessButton =
  document.getElementById("checkAccess");

const logoutButton =
  document.getElementById("logout");


/* =====================================================
   HELPERS
===================================================== */

function normalizeEmail(email) {

  return String(email || "")
    .trim()
    .toLowerCase();

}


function validEmail(email) {

  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/
    .test(email);

}


function showMessage(text, type = "warning") {

  if (!messageBox)
    return;

  messageBox.textContent = text;

  messageBox.className =
    "message " + type;

  messageBox.style.display =
    "block";

}


function hideMessage() {

  if (!messageBox)
    return;

  messageBox.style.display =
    "none";

}


function getEmail() {

  const email =
    normalizeEmail(
      emailInput.value
    );

  if (!validEmail(email)) {

    showMessage(
      "Please enter a valid email address.",
      "error"
    );

    return null;

  }

  return email;

}


/* =====================================================
   CHECK APPROVED EMAIL
   IMPORTANT:
   USE RPC - NOT DIRECT TABLE ACCESS
===================================================== */

async function checkApprovedEmail(email) {

  try {

    const {
      data,
      error
    } =
      await supabaseClient.rpc(
        "check_user_access",
        {
          user_email: email
        }
      );


    if (error) {

      console.error(
        "Access RPC error:",
        error
      );

      showMessage(
        "Unable to check access. Please try again.",
        "error"
      );

      return false;

    }


    /*
      RPC returns TRUE when
      the email is approved.
    */

    if (data === true) {

      localStorage.setItem(
        "eradaApprovedEmail",
        email
      );

      return true;

    }


    localStorage.removeItem(
      "eradaApprovedEmail"
    );


    showMessage(
      "Your email has not been approved yet.",
      "warning"
    );

    return false;

  } catch (error) {

    console.error(
      "Access check exception:",
      error
    );

    showMessage(
      "Unable to check access.",
      "error"
    );

    return false;

  }

}


/* =====================================================
   CHECK ACCESS BUTTON
===================================================== */

checkAccessButton.addEventListener(
  "click",
  async function () {

    const email =
      getEmail();

    if (!email)
      return;


    checkAccessButton.disabled =
      true;


    showMessage(
      "Checking access...",
      "success"
    );


    const approved =
      await checkApprovedEmail(
        email
      );


    if (approved) {

      showMessage(
        "Access approved. Loading private videos...",
        "success"
      );

      await loadPrivateVideos(
        email
      );

    }


    checkAccessButton.disabled =
      false;

  }
);


/* =====================================================
   REQUEST ACCESS
===================================================== */

requestAccessButton.addEventListener(
  "click",
  async function () {

    const email =
      getEmail();

    if (!email)
      return;


    requestAccessButton.disabled =
      true;


    showMessage(
      "Checking your access...",
      "success"
    );


    /*
      First check if already approved.
    */

    const approved =
      await checkApprovedEmail(
        email
      );


    if (approved) {

      showMessage(
        "Your email is already approved. Loading videos...",
        "success"
      );

      await loadPrivateVideos(
        email
      );

      requestAccessButton.disabled =
        false;

      return;

    }


    /*
      Check existing request.
    */

    const {
      data: existing,
      error: existingError
    } =
      await supabaseClient
        .from("access_requests")
        .select(
          "id,email,status"
        )
        .eq(
          "email",
          email
        )
        .maybeSingle();


    if (existingError) {

      console.error(
        "Request check error:",
        existingError
      );

    }


    /*
      Existing request.
    */

    if (existing) {

      const status =
        String(
          existing.status || ""
        ).toLowerCase();


      if (status === "pending") {

        showMessage(
          "Your access request is already pending. Please wait for approval.",
          "warning"
        );

        requestAccessButton.disabled =
          false;

        return;

      }


      /*
        Re-submit rejected request.
      */

      if (status === "rejected") {

        const {
          error
        } =
          await supabaseClient
            .from("access_requests")
            .update({
              status: "pending"
            })
            .eq(
              "id",
              existing.id
            );


        if (error) {

          console.error(
            "Resubmit error:",
            error
          );

          showMessage(
            "Unable to submit your request again.",
            "error"
          );

          requestAccessButton.disabled =
            false;

          return;

        }


        showMessage(
          "Your access request has been submitted again. Please wait for approval.",
          "success"
        );

        requestAccessButton.disabled =
          false;

        return;

      }

    }


    /*
      New request.
    */

    const {
      error
    } =
      await supabaseClient
        .from("access_requests")
        .insert({
          email: email,
          status: "pending"
        });


    if (error) {

      console.error(
        "Create request error:",
        error
      );


      if (
        error.code === "23505"
      ) {

        showMessage(
          "Your access request already exists. Please wait for approval.",
          "warning"
        );

      } else {

        showMessage(
          "Unable to submit access request.",
          "error"
        );

      }


      requestAccessButton.disabled =
        false;

      return;

    }


    showMessage(
      "Your access request has been sent successfully. Please wait for approval.",
      "success"
    );


    requestAccessButton.disabled =
      false;

  }
);


/* =====================================================
   LOAD PRIVATE VIDEOS
===================================================== */

async function loadPrivateVideos(email) {

  videosList.innerHTML = `
    <div class="card">
      <p style="color:var(--text-muted);margin:0;">
        Loading private videos...
      </p>
    </div>
  `;


  /*
    Verify approval again using RPC.
  */

  const approved =
    await checkApprovedEmail(
      email
    );


  if (!approved) {

    videos.style.display =
      "none";

    loginBox.style.display =
      "block";

    videosList.innerHTML =
      "";

    return;

  }


  /*
    Get videos.
  */

  const {
    data,
    error
  } =
    await supabaseClient
      .from("videos")
      .select(
        "id,title,youtube_url,created_at"
      )
      .order(
        "created_at",
        {
          ascending: true
        }
      );


  if (error) {

    console.error(
      "Videos error:",
      error
    );

    showMessage(
      "Unable to load private videos.",
      "error"
    );

    videosList.innerHTML =
      "";

    return;

  }


  /*
    Save approved email.
  */

  localStorage.setItem(
    "eradaApprovedEmail",
    email
  );


  /*
    Hide login.
  */

  loginBox.style.display =
    "none";


  videos.style.display =
    "block";


  hideMessage();


  renderVideos(
    data || []
  );

}


/* =====================================================
   YOUTUBE ID
===================================================== */

function getYoutubeId(url) {

  if (!url)
    return null;


  const patterns = [

    /youtu\.be\/([a-zA-Z0-9_-]{6,})/,

    /[?&]v=([a-zA-Z0-9_-]{6,})/,

    /youtube\.com\/embed\/([a-zA-Z0-9_-]{6,})/,

    /youtube\.com\/shorts\/([a-zA-Z0-9_-]{6,})/

  ];


  for (
    const pattern of patterns
  ) {

    const match =
      String(url).match(
        pattern
      );


    if (match)
      return match[1];

  }


  return null;

}


/* =====================================================
   RENDER VIDEOS
===================================================== */

function renderVideos(rows) {

  videosList.innerHTML =
    "";


  if (
    !rows ||
    rows.length === 0
  ) {

    videosList.innerHTML = `
      <div class="card empty">

        <h2>
          No videos available
        </h2>

        <p>
          There are currently no videos
          in the private library.
        </p>

      </div>
    `;

    return;

  }


  rows.forEach(
    function(row) {

      const youtubeId =
        getYoutubeId(
          row.youtube_url
        );


      if (!youtubeId)
        return;


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "card";


      const title =
        document.createElement(
          "h2"
        );


      title.className =
        "video-title";


      title.textContent =
        row.title ||
        "ERADA Video";


      const videoContainer =
        document.createElement(
          "div"
        );


      videoContainer.className =
        "video";


      const iframe =
        document.createElement(
          "iframe"
        );


      iframe.src =
        "https://www.youtube-nocookie.com/embed/" +
        youtubeId +
        "?modestbranding=1&rel=0&controls=1";


      iframe.title =
        row.title ||
        "ERADA Private Video";


      iframe.loading =
        "lazy";


      iframe.allow =
        "autoplay; encrypted-media; picture-in-picture";


      iframe.allowFullscreen =
        true;


      videoContainer.appendChild(
        iframe
      );


      const info =
        document.createElement(
          "div"
        );


      info.className =
        "video-info";


      info.textContent =
        "🔒 PRIVATE ERADA VIDEO";


      card.appendChild(
        title
      );


      card.appendChild(
        videoContainer
      );


      card.appendChild(
        info
      );


      videosList.appendChild(
        card
      );

    }
  );

}


/* =====================================================
   RESTORE APPROVED SESSION
===================================================== */

async function restoreSession() {

  const savedEmail =
    normalizeEmail(
      localStorage.getItem(
        "eradaApprovedEmail"
      )
    );


  if (
    !savedEmail ||
    !validEmail(savedEmail)
  ) {

    return;

  }


  emailInput.value =
    savedEmail;


  showMessage(
    "Checking your access...",
    "success"
  );


  const approved =
    await checkApprovedEmail(
      savedEmail
    );


  if (approved) {

    await loadPrivateVideos(
      savedEmail
    );

  }

}


/* =====================================================
   LOGOUT
===================================================== */

logoutButton.addEventListener(
  "click",
  async function () {

    localStorage.removeItem(
      "eradaApprovedEmail"
    );


    try {

      await supabaseClient
        .auth
        .signOut();

    } catch (error) {

      console.error(
        "Logout error:",
        error
      );

    }


    stopPolling();


    videosList.innerHTML =
      "";

    videos.style.display =
      "none";

    loginBox.style.display =
      "block";

    emailInput.value =
      "";


    showMessage(
      "You have been logged out.",
      "success"
    );

  }
);


/* =====================================================
   APPROVAL POLLING
===================================================== */

let approvalTimer =
  null;


function startPolling(email) {

  stopPolling();


  approvalTimer =
    setInterval(
      async function () {

        const approved =
          await checkApprovedEmail(
            email
          );


        if (approved) {

          stopPolling();

          await loadPrivateVideos(
            email
          );

        }

      },
      10000
    );

}


function stopPolling() {

  if (approvalTimer) {

    clearInterval(
      approvalTimer
    );

    approvalTimer =
      null;

  }

}


/* =====================================================
   START
===================================================== */

restoreSession();

</script>
