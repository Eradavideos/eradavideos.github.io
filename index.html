<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>ERADA Video Library</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link
  rel="preconnect"
  href="https://fonts.gstatic.com"
  crossorigin
>

<link
  href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
  rel="stylesheet"
>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

:root{

  --bg:#060a17;
  --bg-glow:#0d1428;
  --surface:#0b1226;
  --surface-2:#101a35;

  --border:#22315a;
  --border-soft:#16213f;

  --accent:#ffffff;
  --accent-soft:rgba(255,255,255,.10);
  --accent-dim:rgba(255,255,255,.35);

  --text:#ffffff;
  --text-muted:#aab4d4;
  --text-faint:#6b76a0;

  --success-bg:#0f2a1e;
  --success-text:#86e0aa;

  --error-bg:#341318;
  --error-text:#f2a3a3;

  --warning-bg:#302713;
  --warning-text:#e7ca83;

  --radius:14px;

}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{

  font-family:
    "IBM Plex Sans",
    Arial,
    sans-serif;

  background:
    var(--bg);

  color:
    var(--text);

  min-height:
    100vh;

}

.ambient{

  position:fixed;
  inset:0;

  z-index:-1;

  background:

    radial-gradient(
      60% 45% at 50% 0%,
      rgba(60,90,180,.28),
      transparent 65%
    ),

    radial-gradient(
      80% 60% at 50% 100%,
      rgba(60,90,180,.10),
      transparent 70%
    ),

    var(--bg);

}


/* HEADER */

header{

  text-align:center;

  padding:
    56px 20px 40px;

}

.header-logo{

  width:84px;
  height:84px;

  object-fit:contain;

  display:block;

  margin:
    0 auto 22px;

  border-radius:999px;

  padding:10px;

  border:
    1px solid var(--accent-dim);

  background:
    var(--surface);

}

header h1{

  margin:0;

  font-family:
    "El Messiri",
    serif;

  font-weight:700;

  font-size:34px;

}

header p{

  margin:
    8px 0 0;

  color:
    var(--text-muted);

  font-size:14px;

  letter-spacing:2px;

  text-transform:uppercase;

}


/* CONTAINER */

.container{

  max-width:920px;

  margin:
    0 auto;

  padding:
    0 20px 60px;

}


/* LOGIN */

.login-box{

  max-width:440px;

  margin:
    20px auto 0;

  background:
    var(--surface);

  border:
    1px solid var(--border);

  border-radius:
    var(--radius);

  padding:
    40px 36px 34px;

  box-shadow:
    0 24px 60px -20px rgba(0,0,0,.6);

}

.login-logo{

  width:64px;
  height:64px;

  object-fit:contain;

  display:block;

  margin:
    0 auto 18px;

}

.eyebrow{

  display:block;

  text-align:center;

  font-size:11px;

  letter-spacing:3px;

  text-transform:uppercase;

  color:
    var(--accent);

  margin-bottom:10px;

  font-weight:600;

}

.login-title{

  text-align:center;

  margin:
    0 0 8px;

  font-family:
    "El Messiri",
    serif;

  font-weight:600;

  font-size:22px;

}

.login-description{

  text-align:center;

  color:
    var(--text-muted);

  font-size:14px;

  margin:
    0 0 26px;

}

.ticket-divider{

  height:1px;

  margin:
    26px -36px 24px;

  background:

    repeating-linear-gradient(
      90deg,
      var(--border) 0,
      var(--border) 6px,
      transparent 6px,
      transparent 12px
    );

}


/* INPUT */

input{

  width:100%;

  padding:
    13px 14px;

  margin:
    0 0 12px;

  border:
    1px solid var(--border);

  border-radius:9px;

  font-size:15px;

  background:
    var(--surface-2);

  color:
    var(--text);

  font-family:
    "IBM Plex Sans",
    Arial,
    sans-serif;

}

input::placeholder{

  color:
    var(--text-faint);

}

input:focus{

  outline:none;

  border-color:
    var(--accent);

  box-shadow:
    0 0 0 3px var(--accent-soft);

}


/* BUTTONS */

button{

  padding:
    13px 20px;

  border:
    1px solid transparent;

  border-radius:9px;

  cursor:pointer;

  font-size:14.5px;

  font-weight:600;

  font-family:
    "IBM Plex Sans",
    Arial,
    sans-serif;

  width:100%;

  margin-top:8px;

}

button:disabled{

  opacity:.5;

  cursor:not-allowed;

}

#requestAccess{

  background:
    transparent;

  color:
    var(--text);

  border-color:
    var(--border);

}

#checkAccess{

  background:
    var(--accent);

  color:
    #060a17;

}


/* MESSAGE */

.message{

  margin-top:16px;

  padding:
    12px 14px;

  border-radius:9px;

  display:none;

  font-size:13.5px;

  text-align:center;

  border:
    1px solid transparent;

  line-height:1.5;

}

.error{

  background:
    var(--error-bg);

  color:
    var(--error-text);

}

.success{

  background:
    var(--success-bg);

  color:
    var(--success-text);

}

.warning{

  background:
    var(--warning-bg);

  color:
    var(--warning-text);

}


/* VIDEOS */

#videos{

  display:none;

  margin-top:10px;

}

.library-bar{

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:
    4px 2px 26px;

  border-bottom:
    1px solid var(--border-soft);

  margin-bottom:28px;

}

.library-bar .eyebrow{

  text-align:left;

  margin:0;

}

.logout{

  width:auto;

  margin:0;

  background:
    transparent;

  color:
    var(--text-muted);

  border:
    1px solid var(--border);

  padding:
    9px 16px;

}


/* VIDEO CARD */

.card{

  background:
    var(--surface);

  border:
    1px solid var(--border);

  border-top:
    2px solid var(--border);

  border-radius:
    var(--radius);

  padding:18px;

  margin-bottom:22px;

}

.video-title{

  margin:
    0 0 14px;

  font-family:
    "El Messiri",
    serif;

  font-weight:600;

  font-size:18px;

}

.video{

  position:relative;

  width:100%;

  padding-top:56.25%;

  background:#000;

  border-radius:9px;

  overflow:hidden;

  border:
    1px solid var(--border-soft);

}

.video iframe{

  position:absolute;

  top:0;
  left:0;

  width:100%;
  height:100%;

  border:0;

}

.video-info{

  color:
    var(--text-faint);

  font-size:12.5px;

  margin-top:12px;

}

.empty{

  text-align:center;

  padding:48px 20px;

  color:
    var(--text-muted);

}

.empty h2{

  color:
    var(--text);

  font-family:
    "El Messiri",
    serif;

}


/* FOOTER */

footer{

  text-align:center;

  padding:
    30px 20px 46px;

  color:
    var(--text-faint);

  font-size:12px;

  letter-spacing:1px;

}


/* MOBILE */

@media(max-width:480px){

  header{

    padding:
      36px 15px 30px;

  }

  header h1{

    font-size:28px;

  }

  .container{

    padding:
      0 12px 40px;

  }

  .login-box{

    padding:
      30px 22px 26px;

  }

  .ticket-divider{

    margin:
      22px -22px 20px;

  }

  .library-bar{

    gap:10px;

  }

  .library-bar .eyebrow{

    font-size:10px;

  }

  .logout{

    padding:
      8px 12px;

  }

  .card{

    padding:12px;

  }

}

</style>

</head>


<body>


<div class="ambient"></div>


<header>

<img
  src="erada-logo.png"
  alt="ERADA Logo"
  class="header-logo"
>

<h1>ERADA</h1>

<p>Private Video Library</p>

</header>


<main class="container">


<section
  id="loginBox"
  class="login-box"
>


<img
  src="erada-logo.png"
  alt="ERADA Logo"
  class="login-logo"
>


<span class="eyebrow">
Members Only
</span>


<h2 class="login-title">
Secure Access
</h2>


<p class="login-description">
Enter your approved email address to access the private library.
</p>


<div class="ticket-divider"></div>


<input
  id="email"
  type="email"
  placeholder="Enter your email"
  autocomplete="email"
>


<button
  id="checkAccess"
  type="button"
>
Check Access
</button>


<button
  id="requestAccess"
  type="button"
>
Request Access
</button>


<div
  id="message"
  class="message"
></div>


</section>


<section id="videos">


<div class="library-bar">

<span class="eyebrow">
Private Library
</span>

<button
  id="logout"
  class="logout"
  type="button"
>
Logout
</button>

</div>


<div id="videosList"></div>


</section>


</main>


<footer>
ERADA · PRIVATE VIDEO LIBRARY
</footer>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
  "https://laqwnqnnqtfhqfadjyvo.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_ropVS738K5BJiOoaZ-TeWA_WmkineZh";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY,
    {
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:true
      }
    }
  );


/* =========================================
   ELEMENTS
========================================= */

const emailInput =
  document.getElementById("email");

const loginBox =
  document.getElementById("loginBox");

const videos =
  document.getElementById("videos");

const message =
  document.getElementById("message");

const videosList =
  document.getElementById("videosList");

const requestAccessButton =
  document.getElementById("requestAccess");

const checkAccessButton =
  document.getElementById("checkAccess");


/* =========================================
   HELPERS
========================================= */

function normalizeEmail(email){

  return String(email || "")
    .trim()
    .toLowerCase();

}


function isValidEmail(email){

  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/
    .test(email);

}


function showMessage(
  text,
  type
){

  message.textContent =
    text;

  message.className =
    "message " + type;

  message.style.display =
    "block";

}


function getEmail(){

  const email =
    normalizeEmail(
      emailInput.value
    );


  if(!isValidEmail(email)){

    showMessage(
      "Please enter a valid email address.",
      "error"
    );

    return null;

  }


  return email;

}


/* =========================================
   CHECK APPROVAL
========================================= */

async function isApproved(email){

  try{

    const {
      data,
      error
    } =
      await supabaseClient.rpc(
        "check_erada_access",
        {
          p_email:email
        }
      );


    if(error){

      console.error(
        "Approval RPC error:",
        error
      );

      showMessage(
        "Unable to check your access. Please try again.",
        "error"
      );

      return false;

    }


    return data === true;

  }catch(error){

    console.error(
      "Approval check exception:",
      error
    );

    showMessage(
      "Unable to check your access.",
      "error"
    );

    return false;

  }

}


/* =========================================
   CHECK ACCESS BUTTON
========================================= */

checkAccessButton.addEventListener(
  "click",
  async function(){

    const email =
      getEmail();


    if(!email)
      return;


    checkAccessButton.disabled =
      true;


    showMessage(
      "Checking access...",
      "success"
    );


    try{

      const approved =
        await isApproved(
          email
        );


      if(!approved){

        showMessage(
          "Your email has not been approved yet.",
          "warning"
        );

        return;

      }


      localStorage.setItem(
        "eradaApprovedEmail",
        email
      );


      showMessage(
        "Access approved. Loading private videos...",
        "success"
      );


      await loadPrivateVideos(
        email
      );


    }finally{

      checkAccessButton.disabled =
        false;

    }

  }
);


/* =========================================
   REQUEST ACCESS
========================================= */

requestAccessButton.addEventListener(
  "click",
  async function(){

    const email =
      getEmail();


    if(!email)
      return;


    requestAccessButton.disabled =
      true;


    showMessage(
      "Checking existing access...",
      "success"
    );


    try{

      /* Check if already approved */

      const approved =
        await isApproved(
          email
        );


      if(approved){

        showMessage(
          "This email is already approved. Click Check Access to enter.",
          "success"
        );

        return;

      }


      /* Check existing request */

      const {
        data:existingRequest,
        error:existingError
      } =
        await supabaseClient
          .from("access_requests")
          .select(
            "id,email,status"
          )
          .ilike(
            "email",
            email
          )
          .maybeSingle();


      if(existingError){

        console.error(
          "Existing request error:",
          existingError
        );

      }


      if(existingRequest){

        const status =
          String(
            existingRequest.status || ""
          ).toLowerCase();


        if(status === "rejected"){

          const {
            error:updateError
          } =
            await supabaseClient
              .from("access_requests")
              .update({
                status:"pending"
              })
              .eq(
                "id",
                existingRequest.id
              );


          if(updateError){

            console.error(
              "Request update error:",
              updateError
            );

            showMessage(
              "Unable to submit your request again.",
              "error"
            );

            return;

          }


          showMessage(
            "Your access request has been sent again. Please wait for approval.",
            "success"
          );


          startApprovalPolling(
            email
          );


          return;

        }


        if(status === "pending"){

          showMessage(
            "Your access request is already pending. Please wait for approval.",
            "warning"
          );


          startApprovalPolling(
            email
          );


          return;

        }

      }


      /* New request */

      const {
        error
      } =
        await supabaseClient
          .from("access_requests")
          .insert({
            email:email,
            status:"pending"
          });


      if(error){

        console.error(
          "Access request error:",
          error
        );


        if(error.code === "23505"){

          showMessage(
            "Your access request already exists. Please wait for approval.",
            "warning"
          );

        }else{

          showMessage(
            "Unable to submit access request.",
            "error"
          );

        }

        return;

      }


      showMessage(
        "Your access request has been sent successfully. Please wait for approval.",
        "success"
      );


      startApprovalPolling(
        email
      );


    }catch(error){

      console.error(
        "Request exception:",
        error
      );


      showMessage(
        "Something went wrong. Please try again.",
        "error"
      );

    }finally{

      requestAccessButton.disabled =
        false;

    }

  }
);


/* =========================================
   APPROVAL POLLING
========================================= */

let approvalTimer =
  null;


function startApprovalPolling(
  email
){

  stopApprovalPolling();


  approvalTimer =
    setInterval(
      async function(){

        console.log(
          "Checking approval..."
        );


        const approved =
          await isApproved(
            email
          );


        if(approved){

          stopApprovalPolling();


          localStorage.setItem(
            "eradaApprovedEmail",
            email
          );


          showMessage(
            "Your access has been approved. Loading private videos...",
            "success"
          );


          await loadPrivateVideos(
            email
          );

        }

      },
      10000
    );

}


function stopApprovalPolling(){

  if(approvalTimer){

    clearInterval(
      approvalTimer
    );

    approvalTimer =
      null;

  }

}


/* =========================================
   LOAD PRIVATE VIDEOS
========================================= */

async function loadPrivateVideos(
  email
){

  videosList.innerHTML =
    `
      <div class="card">

        <p style="
          color:var(--text-muted);
          margin:0;
        ">
          Loading private videos...
        </p>

      </div>
    `;


  const approved =
    await isApproved(
      email
    );


  if(!approved){

    localStorage.removeItem(
      "eradaApprovedEmail"
    );


    videos.style.display =
      "none";

    loginBox.style.display =
      "block";


    videosList.innerHTML =
      "";


    showMessage(
      "Your access is no longer approved.",
      "error"
    );


    return;

  }


  /* Get videos through secure RPC */

  const {
    data:rows,
    error
  } =
    await supabaseClient.rpc(
      "get_erada_videos",
      {
        p_email:email
      }
    );


  if(error){

    console.error(
      "Video RPC error:",
      error
    );


    videosList.innerHTML =
      "";


    showMessage(
      "Unable to load private videos.",
      "error"
    );


    return;

  }


  loginBox.style.display =
    "none";


  videos.style.display =
    "block";


  renderPrivateVideos(
    rows || []
  );

}


/* =========================================
   YOUTUBE ID
========================================= */

function extractYoutubeId(
  url
){

  if(!url)
    return null;


  const patterns = [

    /youtu\.be\/([a-zA-Z0-9_-]{6,})/,

    /[?&]v=([a-zA-Z0-9_-]{6,})/,

    /embed\/([a-zA-Z0-9_-]{6,})/,

    /youtube\.com\/shorts\/([a-zA-Z0-9_-]{6,})/

  ];


  for(
    const pattern
    of patterns
  ){

    const match =
      String(url)
        .match(pattern);


    if(match)
      return match[1];

  }


  return null;

}


/* =========================================
   RENDER VIDEOS
========================================= */

function renderPrivateVideos(
  rows
){

  videosList.innerHTML =
    "";


  if(
    !rows ||
    rows.length === 0
  ){

    videosList.innerHTML =
      `
        <div class="card empty">

          <h2>
            No videos available
          </h2>

          <p>
            There are currently no videos
            in the private library.
          </p>

        </div>
      `;

    return;

  }


  let rendered =
    0;


  rows.forEach(
    function(row){

      const youtubeId =
        extractYoutubeId(
          row.youtube_url
        );


      if(!youtubeId)
        return;


      rendered++;


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "card";


      const title =
        document.createElement(
          "h2"
        );


      title.className =
        "video-title";


      title.textContent =
        row.title ||
        "Untitled";


      const videoContainer =
        document.createElement(
          "div"
        );


      videoContainer.className =
        "video";


      const iframe =
        document.createElement(
          "iframe"
        );


      iframe.src =
        "https://www.youtube-nocookie.com/embed/"
        + youtubeId
        + "?modestbranding=1"
        + "&rel=0"
        + "&controls=1";


      iframe.title =
        row.title ||
        "ERADA Private Video";


      iframe.loading =
        "lazy";


      iframe.allow =
        "autoplay; encrypted-media; picture-in-picture";


      iframe.allowFullscreen =
        true;


      videoContainer.appendChild(
        iframe
      );


      const info =
        document.createElement(
          "div"
        );


      info.className =
        "video-info";


      info.textContent =
        "🔒 PRIVATE ERADA VIDEO";


      card.appendChild(
        title
      );


      card.appendChild(
        videoContainer
      );


      card.appendChild(
        info
      );


      videosList.appendChild(
        card
      );

    }
  );


  if(rendered === 0){

    videosList.innerHTML =
      `
        <div class="card empty">

          <h2>
            No videos available
          </h2>

          <p>
            No valid YouTube videos were found.
          </p>

        </div>
      `;

  }

}


/* =========================================
   RESTORE SESSION
========================================= */

async function restoreApprovedSession(){

  const savedEmail =
    normalizeEmail(
      localStorage.getItem(
        "eradaApprovedEmail"
      )
    );


  if(
    !savedEmail ||
    !isValidEmail(savedEmail)
  ){

    return;

  }


  emailInput.value =
    savedEmail;


  showMessage(
    "Checking your access...",
    "success"
  );


  const approved =
    await isApproved(
      savedEmail
    );


  if(!approved){

    localStorage.removeItem(
      "eradaApprovedEmail"
    );


    hideLoginError();

    return;

  }


  await loadPrivateVideos(
    savedEmail
  );

}


function hideLoginError(){

  message.style.display =
    "none";

}


/* =========================================
   LOGOUT
========================================= */

document
  .getElementById("logout")
  .addEventListener(
    "click",
    async function(){

      stopApprovalPolling();


      try{

        await supabaseClient
          .auth
          .signOut();

      }catch(error){

        console.error(
          "Logout error:",
          error
        );

      }


      localStorage.removeItem(
        "eradaApprovedEmail"
      );


      videosList.innerHTML =
        "";


      videos.style.display =
        "none";


      loginBox.style.display =
        "block";


      emailInput.value =
        "";


      showMessage(
        "You have been logged out.",
        "success"
      );

    }
  );


/* =========================================
   PROTECTION
========================================= */

document.addEventListener(
  "contextmenu",
  function(event){

    if(
      event.target.closest(".video")
    ){

      event.preventDefault();

    }

  }
);


document.addEventListener(
  "dragstart",
  function(event){

    if(
      event.target.closest(".video")
    ){

      event.preventDefault();

    }

  }
);


/* =========================================
   START
========================================= */

restoreApprovedSession();

</script>

</body>
</html>
