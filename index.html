<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ERADA Video Library</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg:#060a17; --bg-glow:#0d1428; --surface:#0b1226; --surface-2:#101a35;
      --border:#22315a; --border-soft:#16213f; --accent:#fff;
      --accent-soft:rgba(255,255,255,.10); --accent-dim:rgba(255,255,255,.35);
      --text:#fff; --text-muted:#aab4d4; --text-faint:#6b76a0;
      --success-bg:#0f2a1e; --success-text:#86e0aa;
      --error-bg:#341318; --error-text:#f2a3a3; --radius:14px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:"IBM Plex Sans",Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
    .ambient{position:fixed;inset:0;z-index:-1;background:
      radial-gradient(60% 45% at 50% 0%,rgba(60,90,180,.28),transparent 65%),
      radial-gradient(80% 60% at 50% 100%,rgba(60,90,180,.10),transparent 70%),var(--bg);
      animation:breathe 14s ease-in-out infinite}
    @keyframes breathe{0%,100%{opacity:1}50%{opacity:.7}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .spinner{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.25);
      border-top-color:currentColor;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-3px;margin-left:8px}
    header{text-align:center;padding:56px 20px 40px}
    .header-logo{width:84px;height:84px;object-fit:contain;display:block;margin:0 auto 22px;border-radius:999px;padding:10px;border:1px solid var(--accent-dim);background:var(--surface)}
    header h1{margin:0;font-family:"El Messiri",serif;font-weight:700;font-size:34px;letter-spacing:.5px}
    header p{margin:8px 0 0;color:var(--text-muted);font-size:14px;letter-spacing:2px;text-transform:uppercase}
    .container{max-width:920px;margin:0 auto;padding:0 20px 60px}
    .login-box{max-width:440px;margin:20px auto 0;background:var(--surface);border:1px solid var(--border);
      border-radius:var(--radius);padding:40px 36px 34px;position:relative;box-shadow:0 24px 60px -20px rgba(0,0,0,.6)}
    .login-box:before,.login-box:after{content:"";position:absolute;width:18px;height:18px;border:1px solid var(--accent-dim)}
    .login-box:before{top:-1px;right:-1px;border-left:none;border-bottom:none;border-top-right-radius:var(--radius)}
    .login-box:after{bottom:-1px;left:-1px;border-right:none;border-top:none;border-bottom-left-radius:var(--radius)}
    .login-logo{width:64px;height:64px;object-fit:contain;display:block;margin:0 auto 18px;opacity:.9}
    .eyebrow{display:block;text-align:center;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--accent);margin-bottom:10px;font-weight:600}
    .login-title{text-align:center;margin:0 0 8px;font-family:"El Messiri",serif;font-weight:600;font-size:22px}
    .login-description{text-align:center;color:var(--text-muted);font-size:14px;margin:0 0 26px}
    .ticket-divider{position:relative;height:1px;margin:26px -36px 24px;background-image:repeating-linear-gradient(90deg,var(--border) 0,var(--border) 6px,transparent 6px,transparent 12px)}
    input{width:100%;padding:13px 14px;margin:0 0 12px;border:1px solid var(--border);border-radius:9px;font-size:15px;background:var(--surface-2);color:var(--text);font-family:"IBM Plex Sans",Arial,sans-serif}
    input::placeholder{color:var(--text-faint)}
    input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
    button{padding:13px 20px;border:1px solid transparent;border-radius:9px;cursor:pointer;font-size:14.5px;font-weight:600;font-family:"IBM Plex Sans",Arial,sans-serif;letter-spacing:.2px;transition:transform .12s ease,opacity .12s ease,background .12s ease;width:100%;margin-top:8px}
    button:disabled{opacity:.7;cursor:not-allowed}
    button:active{transform:scale(.98)}
    #requestAccess{background:transparent;color:var(--text);border-color:var(--border)}
    #checkAccess{background:var(--accent);color:#060a17}
    .message{margin-top:16px;padding:12px 14px;border-radius:9px;display:none;font-size:13.5px;text-align:center;border:1px solid transparent}
    .error{background:var(--error-bg);color:var(--error-text);border-color:rgba(240,163,163,.2)}
    .success{background:var(--success-bg);color:var(--success-text);border-color:rgba(127,216,160,.2)}
    .warning{background:#2c2710;color:#f0dc88;border-color:rgba(240,220,136,.2)}
    #videos{display:none;margin-top:10px}
    .library-bar{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 26px;border-bottom:1px solid var(--border-soft);margin-bottom:28px}
    .library-bar .eyebrow{text-align:left;margin:0}
    .logout{width:auto;margin:0;background:transparent;color:var(--text-muted);border:1px solid var(--border);padding:9px 16px;font-size:13px}
    .welcome-bar{font-size:13px;color:var(--text-muted);margin:2px 0 0}
    .welcome-bar strong{color:var(--text);font-weight:600}
    .card{background:var(--surface);border:1px solid var(--border);border-top:2px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:22px;animation:rise .35s ease both}
    .video-title{margin:0 0 14px;font-family:"El Messiri",serif;font-weight:600;font-size:18px}
    .video{position:relative;width:100%;padding-top:56.25%;background:#000;border-radius:9px;overflow:hidden;border:1px solid var(--border-soft)}
    .video iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
    .video-overlay{position:absolute;inset:0;cursor:pointer;display:flex;align-items:center;justify-content:center;background:transparent}
    .play-icon{width:62px;height:62px;border-radius:50%;background:rgba(6,10,23,.6);border:2px solid rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff}
    .video-overlay.is-playing .play-icon{opacity:0}
    .video-overlay.is-playing:hover .play-icon{opacity:1}
    .video-controls-row{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;padding:10px 12px;background:linear-gradient(to top,rgba(0,0,0,.75),transparent);opacity:0;transition:opacity .2s ease}
    .video:hover .video-controls-row,.video-controls-row.force-show{opacity:1}
    .skip-btn,.fullscreen-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:6px;font-size:11px;padding:5px 9px;cursor:pointer;flex-shrink:0;font-family:"IBM Plex Sans",Arial,sans-serif}
    .fullscreen-btn{font-size:13px;line-height:1}
    .seek-track{position:relative;flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.25);cursor:pointer}
    .seek-fill{position:absolute;top:0;left:0;height:100%;width:0%;border-radius:3px;background:#fff}
    .seek-time{font-size:10.5px;color:#fff;flex-shrink:0;min-width:34px;text-align:center}
    .video-info{color:var(--text-faint);font-size:12.5px;margin-top:12px;letter-spacing:.4px}
    .empty{text-align:center;padding:48px 20px;color:var(--text-muted)}
    .empty h2{font-family:"El Messiri",serif;color:var(--text);font-size:18px;margin-bottom:8px}
    .loading-line{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--text-muted);padding:40px 0;font-size:14px}
    footer{text-align:center;padding:30px 20px 46px;color:var(--text-faint);font-size:12px;letter-spacing:1px}
    @media (max-width:480px){
      .login-box{padding:32px 24px 28px}
      .ticket-divider{margin:22px -24px 20px}
      header{padding-top:38px}
      header h1{font-size:28px}
      .library-bar{gap:12px;align-items:flex-start}
      .library-bar .logout{margin-top:0}
      .video-controls-row{opacity:1}
      .skip-btn,.fullscreen-btn{padding:7px 8px}
    }
  </style>
</head>

<body>
  <div class="ambient"></div>

  <header>
    <img src="erada-logo.png" alt="ERADA Logo" class="header-logo">
    <h1>ERADA</h1>
    <p>Private Video Library</p>
  </header>

  <main class="container">
    <section id="loginBox" class="login-box">
      <img src="erada-logo.png" alt="ERADA Logo" class="login-logo">
      <span class="eyebrow">Members Only</span>
      <h2 class="login-title">Secure Access</h2>
      <p class="login-description">Enter your approved email address.</p>
      <div class="ticket-divider"></div>

      <div id="emailStep">
        <input id="email" type="email" placeholder="Enter your email" autocomplete="email">
        <button id="checkAccess" type="button">Check Access</button>
        <button id="requestAccess" type="button">Request Access</button>
      </div>

      <div id="message" class="message"></div>
    </section>

    <section id="videos">
      <div class="library-bar">
        <div>
          <span class="eyebrow">Private Library</span>
          <p class="welcome-bar" id="welcomeBar"></p>
        </div>
        <button id="logout" class="logout" type="button">Logout</button>
      </div>
      <div id="videosList"></div>
    </section>
  </main>

  <footer>ERADA · PRIVATE VIDEO LIBRARY</footer>

  <script>
    "use strict";

    const SUPABASE_URL = "https://laqwnqnnqtfhqfadjyvo.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_ropVS738K5BJiOoaZ-TeWA_WmkineZh";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      }
    );

    const emailInput = document.getElementById("email");
    const loginBox = document.getElementById("loginBox");
    const videos = document.getElementById("videos");
    const message = document.getElementById("message");
    const videosList = document.getElementById("videosList");
    const requestAccessButton = document.getElementById("requestAccess");
    const checkAccessButton = document.getElementById("checkAccess");
    const logoutButton = document.getElementById("logout");

    let approvalTimer = null;
    window.__eradaVideoCards = [];

    function normalizeEmail(email) {
      return String(email || "").trim().toLowerCase();
    }

    function validEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + (type || "warning");
      message.style.display = "block";
    }

    function hideMessage() {
      message.style.display = "none";
    }

    async function checkApprovedEmail(email) {
      const normalized = normalizeEmail(email);

      try {
        const { data, error } = await supabaseClient
          .from("approved_users")
          .select("id,email,status")
          .ilike("email", normalized)
          .eq("status", "approved")
          .maybeSingle();

        if (error) {
          console.error("Approval error:", error);
          showMessage("Unable to check your access. Please try again.", "error");
          return false;
        }

        if (!data) {
          localStorage.removeItem("eradaApprovedEmail");
          showMessage("Your email has not been approved yet.", "warning");
          return false;
        }

        localStorage.setItem("eradaApprovedEmail", normalized);
        return true;
      } catch (err) {
        console.error("Access check exception:", err);
        showMessage("Unable to check your access.", "error");
        return false;
      }
    }

    checkAccessButton.addEventListener("click", async function () {
      const email = normalizeEmail(emailInput.value);

      if (!validEmail(email)) {
        showMessage("Please enter a valid email address.", "error");
        return;
      }

      const original = checkAccessButton.textContent;
      checkAccessButton.disabled = true;
      checkAccessButton.innerHTML = 'Checking<span class="spinner"></span>';

      const approved = await checkApprovedEmail(email);

      if (approved) {
        showMessage("Access approved. Loading private videos...", "success");
        await loadPrivateVideos(email);
        startPolling(email);
      }

      checkAccessButton.disabled = false;
      checkAccessButton.textContent = original;
    });

    requestAccessButton.addEventListener("click", async function () {
      const email = normalizeEmail(emailInput.value);

      if (!validEmail(email)) {
        showMessage("Please enter a valid email address.", "error");
        return;
      }

      const original = requestAccessButton.textContent;
      requestAccessButton.disabled = true;
      requestAccessButton.innerHTML = 'Sending<span class="spinner"></span>';

      try {
        const alreadyApproved = await checkApprovedEmail(email);

        if (alreadyApproved) {
          showMessage("Your email is already approved. Loading videos...", "success");
          await loadPrivateVideos(email);
          startPolling(email);
          return;
        }

        const { data: existing, error: existingError } = await supabaseClient
          .from("access_requests")
          .select("id,email,status")
          .ilike("email", email)
          .maybeSingle();

        if (existingError) {
          console.error("Request lookup error:", existingError);
        }

        if (existing) {
          const status = String(existing.status || "").toLowerCase();

          if (status === "pending") {
            showMessage("Your access request is already pending. Please wait for approval.", "warning");
            return;
          }

          if (status === "rejected") {
            const { error } = await supabaseClient
              .from("access_requests")
              .update({ status: "pending" })
              .eq("id", existing.id);

            if (error) {
              console.error("Resubmit error:", error);
              showMessage("Unable to submit your request again.", "error");
              return;
            }

            showMessage("Your access request has been submitted again. Please wait for approval.", "success");
            startPolling(email);
            return;
          }

          showMessage("Your access request already exists. Please wait for approval.", "warning");
          return;
        }

        const { error } = await supabaseClient
          .from("access_requests")
          .insert({ email: email, status: "pending" });

        if (error) {
          console.error("Create request error:", error);

          if (error.code === "23505") {
            showMessage("Your access request already exists. Please wait for approval.", "warning");
          } else {
            showMessage("Unable to submit access request.", "error");
          }
          return;
        }

        showMessage("Your access request has been sent successfully. Please wait for approval.", "success");
        startPolling(email);
      } catch (err) {
        console.error("Request exception:", err);
        showMessage("Unable to submit access request.", "error");
      } finally {
        requestAccessButton.disabled = false;
        requestAccessButton.textContent = original;
      }
    });

    async function loadPrivateVideos(email) {
      videosList.innerHTML = '<div class="loading-line">Loading private videos<span class="spinner"></span></div>';

      const approved = await checkApprovedEmail(email);

      if (!approved) {
        videos.style.display = "none";
        loginBox.style.display = "block";
        videosList.innerHTML = "";
        return;
      }

      const { data: rows, error } = await supabaseClient
        .from("videos")
        .select("id,title,youtube_url,created_at")
        .order("created_at", { ascending: true });

      if (error) {
        console.error("Video load error:", error);
        showMessage("Unable to load private videos.", "error");
        videosList.innerHTML = "";
        return;
      }

      localStorage.setItem("eradaApprovedEmail", normalizeEmail(email));
      loginBox.style.display = "none";
      videos.style.display = "block";
      hideMessage();

      const welcomeBar = document.getElementById("welcomeBar");
      if (welcomeBar) {
        welcomeBar.innerHTML = "Welcome back, <strong>" + normalizeEmail(email) + "</strong>";
      }

      renderPrivateVideos(rows || []);
    }

    function extractYoutubeId(url) {
      if (!url) return null;

      const patterns = [
        /youtu\.be\/([a-zA-Z0-9_-]{6,})/,
        /[?&]v=([a-zA-Z0-9_-]{6,})/,
        /youtube\.com\/embed\/([a-zA-Z0-9_-]{6,})/,
        /youtube\.com\/shorts\/([a-zA-Z0-9_-]{6,})/
      ];

      for (const pattern of patterns) {
        const match = String(url).match(pattern);
        if (match) return match[1];
      }

      return null;
    }

    function formatTime(seconds) {
      seconds = Math.max(0, Math.floor(seconds || 0));
      const m = Math.floor(seconds / 60);
      const s = String(seconds % 60).padStart(2, "0");
      return m + ":" + s;
    }

    function renderPrivateVideos(rows) {
      videosList.innerHTML = "";
      window.__eradaVideoCards = [];

      if (!rows.length) {
        videosList.innerHTML =
          '<div class="card empty"><h2>No videos available</h2><p>There are currently no videos in the private library.</p></div>';
        return;
      }

      rows.forEach(function (row) {
        const youtubeId = extractYoutubeId(row.youtube_url);
        if (!youtubeId) return;

        const card = document.createElement("div");
        card.className = "card";

        const title = document.createElement("h2");
        title.className = "video-title";
        title.textContent = row.title || "ERADA Video";

        const videoContainer = document.createElement("div");
        videoContainer.className = "video";

        const iframe = document.createElement("iframe");
        iframe.src =
          "https://www.youtube-nocookie.com/embed/" +
          youtubeId +
          "?modestbranding=1&rel=0&controls=0&fs=0&playsinline=1&enablejsapi=1&origin=" +
          encodeURIComponent(window.location.origin);

        iframe.title = row.title || "ERADA Private Video";
        iframe.loading = "lazy";
        iframe.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
        iframe.allowFullscreen = true;

        videoContainer.appendChild(iframe);

        const overlay = document.createElement("div");
        overlay.className = "video-overlay";
        overlay.setAttribute("role", "button");
        overlay.setAttribute("tabindex", "0");
        overlay.setAttribute("aria-label", "Play or pause video");

        const playIcon = document.createElement("div");
        playIcon.className = "play-icon";
        playIcon.textContent = "▶";
        overlay.appendChild(playIcon);
        videoContainer.appendChild(overlay);

        let isPlaying = false;
        let currentTime = 0;
        let duration = 0;

        function sendCommand(func, args) {
          if (!iframe.contentWindow) return;
          iframe.contentWindow.postMessage(
            JSON.stringify({ event: "command", func: func, args: args || [] }),
            "*"
          );
        }

        function togglePlayback() {
          sendCommand(isPlaying ? "pauseVideo" : "playVideo");
          isPlaying = !isPlaying;
          overlay.classList.toggle("is-playing", isPlaying);
          playIcon.textContent = isPlaying ? "❚❚" : "▶";
        }

        overlay.addEventListener("click", togglePlayback);
        overlay.addEventListener("keydown", function (event) {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            togglePlayback();
          }
        });

        const controlsRow = document.createElement("div");
        controlsRow.className = "video-controls-row";

        const skipBack = document.createElement("button");
        skipBack.type = "button";
        skipBack.className = "skip-btn";
        skipBack.textContent = "⏪ 10";

        const seekTrack = document.createElement("div");
        seekTrack.className = "seek-track";

        const seekFill = document.createElement("div");
        seekFill.className = "seek-fill";
        seekTrack.appendChild(seekFill);

        const timeLabel = document.createElement("div");
        timeLabel.className = "seek-time";
        timeLabel.textContent = "0:00";

        const skipForward = document.createElement("button");
        skipForward.type = "button";
        skipForward.className = "skip-btn";
        skipForward.textContent = "10 ⏩";

        const fullscreenBtn = document.createElement("button");
        fullscreenBtn.type = "button";
        fullscreenBtn.className = "fullscreen-btn";
        fullscreenBtn.textContent = "⛶";

        controlsRow.append(skipBack, seekTrack, timeLabel, skipForward, fullscreenBtn);
        videoContainer.appendChild(controlsRow);

        function updateSeekUI() {
          const pct = duration > 0 ? (currentTime / duration) * 100 : 0;
          seekFill.style.width = pct + "%";
          timeLabel.textContent = formatTime(currentTime);
        }

        function seekTo(seconds) {
          seconds = Math.max(0, Math.min(seconds, duration || seconds));
          sendCommand("seekTo", [seconds, true]);
          currentTime = seconds;
          updateSeekUI();
        }

        skipBack.addEventListener("click", e => {
          e.stopPropagation();
          seekTo(currentTime - 10);
        });

        skipForward.addEventListener("click", e => {
          e.stopPropagation();
          seekTo(currentTime + 10);
        });

        seekTrack.addEventListener("click", function (e) {
          e.stopPropagation();
          if (!duration) return;
          const rect = seekTrack.getBoundingClientRect();
          seekTo(((e.clientX - rect.left) / rect.width) * duration);
        });

        fullscreenBtn.addEventListener("click", function (e) {
          e.stopPropagation();
          if (document.fullscreenElement) {
            document.exitFullscreen();
          } else if (videoContainer.requestFullscreen) {
            videoContainer.requestFullscreen();
          } else if (videoContainer.webkitRequestFullscreen) {
            videoContainer.webkitRequestFullscreen();
          }
        });

        window.__eradaVideoCards.push({
          getContentWindow: () => iframe.contentWindow,
          onInfo: function (info) {
            if (typeof info.duration === "number") duration = info.duration;
            if (typeof info.currentTime === "number") currentTime = info.currentTime;
            if (typeof info.playerState === "number") {
              isPlaying = info.playerState === 1;
              overlay.classList.toggle("is-playing", isPlaying);
              playIcon.textContent = isPlaying ? "❚❚" : "▶";
            }
            updateSeekUI();
          }
        });

        iframe.addEventListener("load", function () {
          sendCommand("addEventListener", ["onReady"]);
          iframe.contentWindow.postMessage(
            JSON.stringify({ event: "listening", id: youtubeId }),
            "*"
          );
        });

        const info = document.createElement("div");
        info.className = "video-info";
        info.textContent = "🔒 PRIVATE ERADA VIDEO";

        card.append(title, videoContainer, info);
        videosList.appendChild(card);
      });
    }

    window.addEventListener("message", function (event) {
      if (typeof event.origin !== "string" || event.origin.indexOf("youtube") === -1) return;

      let data;
      try {
        data = typeof event.data === "string" ? JSON.parse(event.data) : event.data;
      } catch (_) {
        return;
      }

      if (!data || data.event !== "infoDelivery" || !data.info) return;

      for (const card of window.__eradaVideoCards) {
        if (card.getContentWindow() === event.source) {
          card.onInfo(data.info);
          break;
        }
      }
    });

    function startPolling(email) {
      stopPolling();

      approvalTimer = setInterval(async function () {
        const approved = await checkApprovedEmail(email);

        if (approved && videos.style.display !== "block") {
          await loadPrivateVideos(email);
        }
      }, 10000);
    }

    function stopPolling() {
      if (approvalTimer) {
        clearInterval(approvalTimer);
        approvalTimer = null;
      }
    }

    async function restoreSession() {
      const savedEmail = normalizeEmail(localStorage.getItem("eradaApprovedEmail"));

      if (!savedEmail || !validEmail(savedEmail)) return;

      emailInput.value = savedEmail;

      const approved = await checkApprovedEmail(savedEmail);

      if (approved) {
        await loadPrivateVideos(savedEmail);
        startPolling(savedEmail);
      } else {
        localStorage.removeItem("eradaApprovedEmail");
      }
    }

    logoutButton.addEventListener("click", async function () {
      stopPolling();

      try {
        await supabaseClient.auth.signOut();
      } catch (err) {
        console.error("Logout error:", err);
      }

      localStorage.removeItem("eradaApprovedEmail");
      videos.style.display = "none";
      loginBox.style.display = "block";
      videosList.innerHTML = "";
      emailInput.value = "";

      const welcomeBar = document.getElementById("welcomeBar");
      if (welcomeBar) welcomeBar.textContent = "";

      showMessage("You have been logged out.", "success");
    });

    document.addEventListener("contextmenu", function (event) {
      if (event.target.closest(".video")) event.preventDefault();
    });

    document.addEventListener("dragstart", function (event) {
      if (event.target.closest(".video")) event.preventDefault();
    });

    document.addEventListener("keydown", function (event) {
      if (event.ctrlKey && ["s", "u"].includes(event.key.toLowerCase())) {
        event.preventDefault();
      }
    });

    restoreSession();
  </script>
</body>
</html>
