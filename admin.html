<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>ERADA — مكتبة الفيديوهات</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { font-family: system-ui, sans-serif; background:#0d0d0d; color:#fff; margin:0; padding:24px; }
  h1 { text-align:center; margin-bottom:24px; }
  .status { text-align:center; margin:40px 0; opacity:.7; }
  .grid {
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap:20px;
    max-width:1100px;
    margin:0 auto;
  }
  .card {
    background:#1a1a1a;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.4);
  }
  .card h3 { margin:12px; font-size:16px; }
  .video-wrap {
    position:relative;
    width:100%;
    padding-top:56.25%; /* نسبة 16:9 */
  }
  .video-wrap iframe {
    position:absolute; top:0; left:0; width:100%; height:100%; border:0;
  }
  /* طبقة شفافة فوق الفيديو لمنع الضغط اليمين / اختيار النص حول المشغل */
  .no-select { user-select:none; -webkit-user-select:none; }
</style>
</head>
<body class="no-select" oncontextmenu="return false;">

<h1>ERADA — مكتبة الفيديوهات</h1>
<div id="status" class="status">جارِ التحقق من صلاحية الدخول...</div>
<div id="grid" class="grid"></div>

<script>
  // -------- إعدادات Supabase --------
  const SUPABASE_URL = "ضع رابط مشروعك هنا";
  const SUPABASE_ANON_KEY = "ضع anon key هنا";

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const statusEl = document.getElementById("status");
  const gridEl = document.getElementById("grid");

  async function loadVideos() {
    const { data: { user }, error: userError } = await supabase.auth.getUser();

    if (userError || !user) {
      statusEl.textContent = "لازم تسجل دخول أولاً لمشاهدة الفيديوهات.";
      return;
    }

    // RLS في قاعدة البيانات يمنع غير الموافق عليهم من جلب أي صف أصلاً
    const { data: videos, error } = await supabase
      .from("videos")
      .select("id, title, youtube_id")
      .order("sort_order", { ascending: true });

    if (error) {
      statusEl.textContent = "غير مصرح لك بمشاهدة هذه الصفحة.";
      return;
    }

    if (!videos || videos.length === 0) {
      statusEl.textContent = "لا توجد فيديوهات متاحة حالياً.";
      return;
    }

    statusEl.remove();

    videos.forEach(v => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="video-wrap">
          <iframe
            src="https://www.youtube-nocookie.com/embed/${v.youtube_id}?modestbranding=1&rel=0&controls=1&disablekb=1"
            title="${v.title}"
            allow="autoplay; encrypted-media"
            allowfullscreen
          ></iframe>
        </div>
        <h3>${v.title}</h3>
      `;
      gridEl.appendChild(card);
    });
  }

  loadVideos();
</script>
</body>
</html>
