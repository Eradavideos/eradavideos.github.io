<script>


/* =========================================
   SUPABASE SETTINGS
========================================= */

const SUPABASE_URL =
  "https://laqwnqnnqtfhqfadjyvo.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_ropVS738K5BJiOoaZ-TeWA_WmkineZh";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =========================================
   ELEMENTS
========================================= */

const adminEmail =
  document.getElementById("adminEmail");

const adminPassword =
  document.getElementById("adminPassword");

const loginMessage =
  document.getElementById("loginMessage");

const loginBox =
  document.getElementById("loginBox");

const adminPanel =
  document.getElementById("adminPanel");

const requestsList =
  document.getElementById("requestsList");

const videoTitle =
  document.getElementById("videoTitle");

const videoUrl =
  document.getElementById("videoUrl");

const videoMessage =
  document.getElementById("videoMessage");

const videosList =
  document.getElementById("videosList");


/* =========================================
   LOGIN MESSAGE
========================================= */

function showLoginMessage(
  text,
  type = ""
) {

  loginMessage.innerHTML =
    `<div class="message ${type}">
      ${text}
    </div>`;

}


/* =========================================
   CHECK ADMIN USER
========================================= */

async function checkAdminUser(
  email
) {

  const {
    data: admin,
    error
  } =
    await supabaseClient
      .from("admin_users")
      .select("id,email")
      .ilike("email", email)
      .maybeSingle();


  if (error) {

    console.error(
      "Admin check error:",
      error
    );

    return false;
  }


  return !!admin;

}


/* =========================================
   SHOW ADMIN PANEL
========================================= */

async function showAdminPanel() {

  loginBox.classList.add(
    "hidden"
  );

  adminPanel.classList.remove(
    "hidden"
  );


  await loadRequests();

  await loadVideos();

}


/* =========================================
   ADMIN LOGIN
========================================= */

document
  .getElementById("adminLogin")
  .addEventListener(
    "click",
    async function () {


      const email =
        adminEmail.value
          .trim()
          .toLowerCase();


      const password =
        adminPassword.value;


      /* CHECK EMAIL */

      if (
        email !==
        "it@erada.ly"
      ) {

        showLoginMessage(
          "Only IT@erada.ly can access the admin panel.",
          "error"
        );

        return;
      }


      /* CHECK PASSWORD */

      if (!password) {

        showLoginMessage(
          "Please enter your password.",
          "error"
        );

        return;
      }


      showLoginMessage(
        "Signing in...",
        ""
      );


      /* LOGIN WITH PASSWORD */

      const {
        data,
        error
      } =
        await supabaseClient
          .auth
          .signInWithPassword({

            email: email,

            password: password

          });


      /* LOGIN ERROR */

      if (error) {

        console.error(
          "Login error:",
          error
        );

        showLoginMessage(
          "Invalid email or password.",
          "error"
        );

        return;
      }


      /* CHECK AUTHENTICATED EMAIL */

      const authenticatedEmail =
        data.user?.email
          ?.trim()
          .toLowerCase();


      if (
        authenticatedEmail !==
        "it@erada.ly"
      ) {

        await supabaseClient
          .auth
          .signOut();


        showLoginMessage(
          "Only IT@erada.ly can access the admin panel.",
          "error"
        );

        return;
      }


      /* CHECK ADMIN TABLE */

      const isAdmin =
        await checkAdminUser(
          authenticatedEmail
        );


      if (!isAdmin) {

        await supabaseClient
          .auth
          .signOut();


        showLoginMessage(
          "You are not authorized to access the admin panel.",
          "error"
        );

        return;
      }


      /* SUCCESS */

      adminPassword.value =
        "";


      showLoginMessage(
        "Login successful.",
        "success"
      );


      await showAdminPanel();

    }
  );


/* =========================================
   FORGOT PASSWORD
========================================= */

document
  .getElementById("forgotPassword")
  .addEventListener(
    "click",
    async function () {


      const email =
        adminEmail.value
          .trim()
          .toLowerCase();


      if (
        email !==
        "it@erada.ly"
      ) {

        showLoginMessage(
          "Enter IT@erada.ly first.",
          "error"
        );

        return;
      }


      showLoginMessage(
        "Sending password recovery email...",
        ""
      );


      const {
        error
      } =
        await supabaseClient
          .auth
          .resetPasswordForEmail(
            email,
            {

              redirectTo:
                "https://eradavideos.github.io/reset-password.html"

            }
          );


      if (error) {

        console.error(
          "Password reset error:",
          error
        );

        showLoginMessage(
          "Unable to send password recovery email.",
          "error"
        );

        return;
      }


      showLoginMessage(
        "Password recovery link has been sent to IT@erada.ly.",
        "success"
      );

    }
  );


/* =========================================
   LOAD ACCESS REQUESTS
========================================= */

async function loadRequests() {

  requestsList.innerHTML =
    "Loading...";


  const {
    data,
    error
  } =
    await supabaseClient
      .from("access_requests")
      .select(
        "id,email,status,created_at"
      )
      .eq(
        "status",
        "pending"
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    console.error(
      "Requests error:",
      error
    );


    requestsList.innerHTML =
      "Unable to load requests.";


    return;
  }


  if (
    !data ||
    data.length === 0
  ) {

    requestsList.innerHTML =
      "<p>No pending requests.</p>";


    return;
  }


  requestsList.innerHTML =
    "";


  data.forEach(
    function(request) {


      const div =
        document.createElement(
          "div"
        );


      div.className =
        "request";


      div.innerHTML = `

        <div class="email">
          ${escapeHtml(request.email)}
        </div>

        <button
          class="approve"
          onclick="approveRequest('${request.id}')"
        >
          Approve
        </button>

        <button
          class="reject"
          onclick="rejectRequest('${request.id}')"
        >
          Reject
        </button>

      `;


      requestsList.appendChild(
        div
      );

    }
  );

}


/* =========================================
   APPROVE REQUEST
========================================= */

async function approveRequest(
  id
) {


  if (
    !confirm(
      "Approve this email?"
    )
  ) {

    return;
  }


  const {
    error
  } =
    await supabaseClient
      .rpc(
        "approve_access_request",
        {
          request_id: id
        }
      );


  if (error) {

    console.error(
      "Approve error:",
      error
    );


    alert(
      "Unable to approve this request."
    );


    return;
  }


  alert(
    "Access approved successfully."
  );


  await loadRequests();

}


/* =========================================
   REJECT REQUEST
========================================= */

async function rejectRequest(
  id
) {


  if (
    !confirm(
      "Reject this email?"
    )
  ) {

    return;
  }


  const {
    error
  } =
    await supabaseClient
      .rpc(
        "reject_access_request",
        {
          request_id: id
        }
      );


  if (error) {

    console.error(
      "Reject error:",
      error
    );


    alert(
      "Unable to reject this request."
    );


    return;
  }


  alert(
    "Request rejected."
  );


  await loadRequests();

}


/* =========================================
   REFRESH REQUESTS
========================================= */

document
  .getElementById(
    "refreshRequests"
  )
  .addEventListener(
    "click",
    loadRequests
  );

   ADD VIDEO
========================================= */

document
  .getElementById("addVideo")
  .addEventListener(
    "click",
    async function () {


      const title =
        videoTitle.value
          .trim();


      const url =
        videoUrl.value
          .trim();


      if (
        !title ||
        !url
      ) {

        videoMessage.innerHTML =
          `<div class="message error">
            Please enter the video title and YouTube link.
          </div>`;

        return;
      }


      const {
        error
      } =
        await supabaseClient
          .from("videos")
          .insert({

            title: title,

            youtube_url: url

          });


      if (error) {

        console.error(
          "Add video error:",
          error
        );


        videoMessage.innerHTML =
          `<div class="message error">
            Unable to add video.
          </div>`;


        return;
      }


      videoMessage.innerHTML =
        `<div class="message success">
          Video added successfully.
        </div>`;


      videoTitle.value =
        "";


      videoUrl.value =
        "";


      await loadVideos();

    }
  );


/* =========================================
   LOAD VIDEOS
========================================= */

async function loadVideos() {

  videosList.innerHTML =
    "Loading...";


  const {
    data,
    error
  } =
    await supabaseClient
      .from("videos")
      .select(
        "id,title,youtube_url,created_at"
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    console.error(
      "Videos error:",
      error
    );


    videosList.innerHTML =
      "Unable to load videos.";


    return;
  }


  if (
    !data ||
    data.length === 0
  ) {

    videosList.innerHTML =
      "<p>No videos added yet.</p>";


    return;
  }


  videosList.innerHTML =
    "";


  data.forEach(
    function(video) {


      const div =
        document.createElement(
          "div"
        );


      div.className =
        "request";


      div.innerHTML = `

        <div class="email">
          ${escapeHtml(video.title)}
        </div>

        <div class="video-url">
          ${escapeHtml(video.youtube_url)}
        </div>

        <button
          class="approve"
          onclick="editVideo('${video.id}')"
        >
          ✏️ Edit
        </button>

        <button
          class="reject"
          onclick="deleteVideo('${video.id}')"
        >
          🗑️ Delete
        </button>

      `;


      videosList.appendChild(
        div
      );

    }
  );

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(
  text
) {

  return String(text)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================
   EDIT VIDEO
========================================= */

async function editVideo(
  id
) {


  const newTitle =
    prompt(
      "Enter the new video title:"
    );


  if (
    newTitle === null
  ) {

    return;
  }


  const title =
    newTitle.trim();


  if (!title) {

    alert(
      "Video title cannot be empty."
    );

    return;
  }


  const newUrl =
    prompt(
      "Enter the new YouTube link:"
    );


  if (
    newUrl === null
  ) {

    return;
  }


  const youtube_url =
    newUrl.trim();


  if (!youtube_url) {

    alert(
      "YouTube link cannot be empty."
    );

    return;
  }


  const {
    error
  } =
    await supabaseClient
      .from("videos")
      .update({

        title: title,

        youtube_url: youtube_url

      })
      .eq(
        "id",
        id
      );


  if (error) {

    console.error(
      "Edit video error:",
      error
    );


    alert(
      "Unable to update video."
    );


    return;
  }


  alert(
    "Video updated successfully."
  );


  await loadVideos();

}


/* =========================================
   DELETE VIDEO
========================================= */

async function deleteVideo(
  id
) {


  const confirmed =
    confirm(
      "Are you sure you want to delete this video?"
    );


  if (!confirmed) {

    return;
  }


  const {
    error
  } =
    await supabaseClient
      .from("videos")
      .delete()
      .eq(
        "id",
        id
      );


  if (error) {

    console.error(
      "Delete video error:",
      error
    );


    alert(
      "Unable to delete video."
    );


    return;
  }


  alert(
    "Video deleted successfully."
  );


  await loadVideos();

}

      await supabaseClient
        .auth
        .signOut();


      adminPanel
        .classList
        .add("hidden");


      loginBox
        .classList
        .remove("hidden");


      adminEmail.value =
        "";


      adminPassword.value =
        "";


      loginMessage.innerHTML =
        `<div class="message success">
          You have been logged out.
        </div>`;

    }
  );


</script>
