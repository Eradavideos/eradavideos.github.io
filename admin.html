const SUPABASE_URL =
  "https://laqwnqnnqtfhqfadjyvo.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_ropVS738K5BJiOoaZ-TeWA_WmkineZh";

/* =====================================================
   HELPERS
===================================================== */

const $ =
  id =>
    document.getElementById(id);


const esc =
  value =>
    String(value ?? "")
      .replace(
        /[&<>"']/g,
        c =>
          ({
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"
          }[c])
      );


const dateText =
  value =>
    value
      ? new Date(value).toLocaleString()
      : "—";


function badge(status){

  const clean =
    String(status || "")
      .toLowerCase();

  return `
    <span class="badge ${esc(clean)}">
      ${esc(status || "unknown")}
    </span>
  `;

}


function message(
  el,
  text,
  type="success"
){

  if(!el)
    return;

  el.innerHTML =
    `
    <div class="message ${type}">
      ${esc(text)}
    </div>
    `;

}


/* =====================================================
   ADMIN CHECK
===================================================== */

async function checkAdmin(){

  try{

    const {
      data,
      error
    } =
      await db.rpc(
        "is_admin"
      );


    if(error){

      console.error(
        "Admin check error:",
        error
      );

      return false;

    }


    return data === true;

  }catch(error){

    console.error(
      "Admin check exception:",
      error
    );

    return false;

  }

}


/* =====================================================
   LOGIN
===================================================== */

async function login(){

  const email =
    $("adminEmail")
      .value
      .trim()
      .toLowerCase();


  const password =
    $("adminPassword")
      .value;


  if(email !== ADMIN_EMAIL){

    message(
      $("loginMessage"),
      "Only IT@erada.ly can access the admin panel.",
      "error"
    );

    return;

  }


  if(!password){

    message(
      $("loginMessage"),
      "Please enter your password.",
      "error"
    );

    return;

  }


  message(
    $("loginMessage"),
    "Signing in..."
  );


  const {
    data,
    error
  } =
    await db.auth.signInWithPassword({

      email,
      password

    });


  if(error){

    console.error(
      "Login error:",
      error
    );

    message(
      $("loginMessage"),
      "Invalid email or password.",
      "error"
    );

    return;

  }


  const isAdmin =
    await checkAdmin();


  if(!isAdmin){

    await db.auth.signOut();

    message(
      $("loginMessage"),
      "You are not authorized to access the admin panel.",
      "error"
    );

    return;

  }


  $("loginMessage").innerHTML = "";


  $("adminName").textContent =
    data.user?.email ||
    ADMIN_EMAIL;


  $("loginScreen")
    .classList
    .add("hidden");


  $("app")
    .classList
    .remove("hidden");


  await refreshAll();

}

/* =====================================================
   ACCESS REQUESTS
===================================================== */

let allRequests = [];

let requestFilter =
  "all";


async function loadRequests(){

  const {
    data,
    error
  } =
    await db.rpc(
      "admin_get_access_requests"
    );


  if(error){

    console.error(
      "Requests error:",
      error
    );


    $("requestsTable").innerHTML =
      `
      <tr>

        <td colspan="4">

          Unable to load access requests.

          <br><br>

          ${esc(error.message)}

        </td>

      </tr>
      `;


    return [];

  }


  allRequests =
    data || [];


  const pending =
    allRequests.filter(
      r =>
        String(r.status)
          .toLowerCase()
          === "pending"
    );


  $("statRequests").textContent =
    pending.length;


  $("statTotalRequests").textContent =
    allRequests.length;


  renderRequests(
    allRequests
  );


  renderRecent(
    allRequests.slice(0,5)
  );


  return allRequests;

}


/* =====================================================
   RENDER REQUESTS
===================================================== */

function renderRequests(
  data
){

  const search =
    $("requestSearch")
      .value
      .trim()
      .toLowerCase();


  let rows =
    data.filter(
      r =>
        String(r.email)
          .toLowerCase()
          .includes(search)
    );


  if(
    requestFilter ===
    "pending"
  ){

    rows =
      rows.filter(
        r =>
          String(r.status)
            .toLowerCase()
            === "pending"
      );

  }


  $("requestsTable").innerHTML =
    rows.length

    ?

    rows.map(
      r => {

        const status =
          String(r.status)
            .toLowerCase();


        let actions =
          "—";


        if(
          status === "pending"
        ){

          actions = `

            <div class="actions">

              <button
                class="btn-success"
                onclick="approveRequest('${esc(r.id)}')"
              >
                ✓ Approve
              </button>


              <button
                class="btn-danger"
                onclick="rejectRequest('${esc(r.id)}')"
              >
                ✕ Reject
              </button>

            </div>

          `;

        }


        return `

          <tr>

            <td>
              ${esc(r.email)}
            </td>

            <td>
              ${badge(r.status)}
            </td>

            <td>
              ${dateText(r.created_at)}
            </td>

            <td>
              ${actions}
            </td>

          </tr>

        `;

      }
    ).join("")

    :

    `

      <tr>

        <td
          colspan="4"
          class="empty"
        >

          ${
            requestFilter === "pending"
            ? "No pending requests."
            : "No access requests found."
          }

        </td>

      </tr>

    `;

}


/* =====================================================
   RECENT REQUESTS
===================================================== */

function renderRecent(
  data
){

  $("recentRequests").innerHTML =

/* =====================================================
   APPROVE REQUEST
===================================================== */

async function approveRequest(
  id
){

  if(
    !confirm(
      "Approve this access request?"
    )
  )
    return;


  const {
    data,
    error
  } =
    await db.rpc(
      "admin_approve_access_request",
      {
        request_id:
          id
      }
    );


  if(error){

    console.error(
      "Approve error:",
      error
    );


    alert(
      "Unable to approve this request:\n\n"
      + error.message
    );

    return;

  }


  if(data !== true){

    alert(
      "The request could not be approved."
    );

    return;

  }


  message(
    $("requestMessage"),
    "Access approved successfully."
  );


  await loadRequests();

  await loadUsers();

}


/* =====================================================
   REJECT REQUEST
===================================================== */

async function rejectRequest(
  id
){

  if(
    !confirm(
      "Reject this access request?"
    )
  )
    return;


  const {
    data,
    error
  } =
    await db.rpc(
      "admin_reject_access_request",
      {
        request_id:
          id
      }
    );


  if(error){

    console.error(
      "Reject error:",
      error
    );


    alert(
      "Unable to reject this request:\n\n"
      + error.message
    );

    return;

  }


  if(data !== true){

    alert(
      "The request could not be rejected."
    );

    return;

  }


  message(
    $("requestMessage"),
    "Access request rejected."
  );


  await loadRequests();

}


/* =====================================================

let allUsers = [];


async function loadUsers(){

  const {
    data,
    error
  } =
    await db
      .from("approved_users")
      .select(
        "id,email,status,created_at"
      )
      .order(
        "email",
        {
          ascending:
            true
        }
      );


  if(error){

    console.error(
      "Users error:",
      error
    );


    $("usersTable").innerHTML =
      `

      <tr>

        <td colspan="4">

          Unable to load users.

          <br><br>

          ${esc(error.message)}

        </td>

      </tr>

      `;


    return [];

  }


  allUsers =
    data || [];


  $("statUsers").textContent =
    allUsers.filter(
      u =>
        String(u.status)
          .toLowerCase()
          === "approved"
    ).length;


  renderUsers(
    allUsers
  );


  return allUsers;

}

   RENDER USERS

            <td>

async function removeUser(
  id
){

  if(
    !confirm(
      "Remove access for this user?"
    )
  )
    return;


  const {
    error
  } =
    await db
      .from("approved_users")
      .delete()
      .eq(
        "id",
        id
      );


  if(error){

    console.error(
      "Remove user error:",
      error
    );


    alert(
      "Unable to remove access:\n\n"
      + error.message
    );

    return;

  }


  message(
    $("userMessage"),
    "User access removed."
  );


  await loadUsers();

}

/* =====================================================
   EDIT VIDEO
===================================================== */

async function editVideo(
  id
){

  const {
    data,
    error
  } =
    await db
      .from("videos")
      .select(
        "title,youtube_url"
      )
      .eq(
        "id",
        id
      )
      .single();


  if(error){

    console.error(
      "Edit load error:",
      error
    );


    alert(
      "Unable to load video."
    );

    return;

  }


  const title =
    prompt(
      "Video title:",
      data.title
    );


  if(
    title === null
  )
    return;


  const url =
    prompt(
      "YouTube link:",
      data.youtube_url
    );


  if(
    url === null
  )
    return;


  if(
    !title.trim() ||
    !url.trim()
  ){

    alert(
      "Title and URL cannot be empty."
    );

    return;

  }


  const {
    error:e
  } =
    await db
      .from("videos")
      .update({
        title:
          title.trim(),

        youtube_url:
          url.trim()
      })
      .eq(
        "id",
        id
      );


  if(e){

    console.error(
      "Edit video error:",
      e
    );


    alert(
      "Unable to update video:\n\n"
      + e.message
    );

    return;

  }


  await loadVideos();

}

/* =====================================================
   PAGE NAVIGATION
===================================================== */

function showPage(
  page
){

  document
    .querySelectorAll(".page")
    .forEach(
      x =>
        x.classList.add(
          "hidden"
        )
    );


  const target =
    $(page + "Page");


  if(target){

    target
      .classList
      .remove("hidden");

  }


  document
    .querySelectorAll(".nav-btn")
    .forEach(
      x =>
        x.classList.toggle(
          "active",
          x.dataset.page === page
        )
    );


  $("sidebar")
    .classList
    .remove("open");


  if(
    page === "requests"
  )
    loadRequests();


  if(
    page === "users"
  )
    loadUsers();


  if(
    page === "videos"
  )
    loadVideos();

}

/* =====================================================
   AUTO LOGIN
===================================================== */

(async () => {

  try{

    const {
      data,
      error
    } =
      await db.auth.getSession();


    if(error){

      console.error(
        "Session error:",
        error
      );

      return;

    }


    const session =
      data?.session;


    if(!session)
      return;


    const email =
      session.user?.email
        ?.trim()
        .toLowerCase();


    if(
      email !==
      ADMIN_EMAIL
    ){

      await db.auth.signOut();

      return;

    }


    const isAdmin =
      await checkAdmin();


    if(!isAdmin){

      await db.auth.signOut();

      return;

    }


    $("adminName")
      .textContent =
        email;


    $("loginScreen")
      .classList
      .add("hidden");


    $("app")
      .classList
      .remove("hidden");


    await refreshAll();

  }catch(error){

    console.error(
      "Auto login error:",
      error
    );

  }

})();


})();
</script>
