<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://laqwnqnnqtfhqfadjyvo.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_ropVS738K5BJiOoaZ-TeWA_WmkineZh";

const ADMIN_EMAIL =
  "it@erada.ly";


const db =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =====================================================
   HELPERS
===================================================== */

const $ = id =>
  document.getElementById(id);


const esc = value =>
  String(value ?? "")
    .replace(
      /[&<>"']/g,
      c =>
        ({
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#039;"
        }[c])
    );


const dateText = value =>
  value
    ? new Date(value).toLocaleString()
    : "—";


function badge(status){

  const clean =
    String(status || "")
      .toLowerCase();

  return `
    <span class="badge ${esc(clean)}">
      ${esc(status || "unknown")}
    </span>
  `;
}


function message(el,text,type="success"){

  el.innerHTML =
    `
    <div class="message ${type}">
      ${esc(text)}
    </div>
    `;

}


/* =====================================================
   ADMIN CHECK
===================================================== */

async function checkAdmin(){

  const {
    data,
    error
  } =
    await db.rpc(
      "is_admin"
    );


  if(error){

    console.error(
      "Admin check error:",
      error
    );

    return false;
  }


  return data === true;

}


/* =====================================================
   LOGIN
===================================================== */

async function login(){

  const email =
    $("adminEmail")
      .value
      .trim()
      .toLowerCase();


  const password =
    $("adminPassword")
      .value;


  if(email !== ADMIN_EMAIL){

    message(
      $("loginMessage"),
      "Only IT@erada.ly can access the admin panel.",
      "error"
    );

    return;
  }


  if(!password){

    message(
      $("loginMessage"),
      "Please enter your password.",
      "error"
    );

    return;
  }


  message(
    $("loginMessage"),
    "Signing in..."
  );


  const {
    data,
    error
  } =
    await db.auth.signInWithPassword({
      email,
      password
    });


  if(error){

    console.error(error);

    message(
      $("loginMessage"),
      "Invalid email or password.",
      "error"
    );

    return;
  }


  const isAdmin =
    await checkAdmin();


  if(!isAdmin){

    await db.auth.signOut();

    message(
      $("loginMessage"),
      "You are not authorized to access the admin panel.",
      "error"
    );

    return;
  }


  $("loginMessage").innerHTML = "";

  $("adminName").textContent =
    data.user?.email || ADMIN_EMAIL;


  $("loginScreen")
    .classList
    .add("hidden");


  $("app")
    .classList
    .remove("hidden");


  await refreshAll();

}


/* =====================================================
   LOGIN EVENTS
===================================================== */

$("loginBtn").onclick =
  login;


$("adminPassword")
  .addEventListener(
    "keydown",
    e => {

      if(e.key === "Enter")
        login();

    }
  );


/* =====================================================
   FORGOT PASSWORD
===================================================== */

$("forgotBtn").onclick =
  async () => {

    const email =
      $("adminEmail")
        .value
        .trim()
        .toLowerCase();


    if(email !== ADMIN_EMAIL){

      message(
        $("loginMessage"),
        "Enter IT@erada.ly first.",
        "error"
      );

      return;
    }


    const {
      error
    } =
      await db.auth
        .resetPasswordForEmail(
          email,
          {
            redirectTo:
              "https://eradavideos.github.io/reset-password.html"
          }
        );


    if(error){

      console.error(error);

      message(
        $("loginMessage"),
        "Unable to send recovery email.",
        "error"
      );

      return;
    }


    message(
      $("loginMessage"),
      "Password recovery link has been sent."
    );

  };


/* =====================================================
   ACCESS REQUESTS
===================================================== */

let allRequests = [];

let requestFilter = "all";


async function loadRequests(){

  const {
    data,
    error
  } =
    await db.rpc(
      "admin_get_access_requests"
    );


  if(error){

    console.error(
      "Requests error:",
      error
    );


    $("requestsTable").innerHTML =
      `
      <tr>
        <td colspan="4">
          Unable to load access requests.
          <br>
          ${esc(error.message)}
        </td>
      </tr>
      `;


    return [];

  }


  allRequests =
    data || [];


  const pending =
    allRequests.filter(
      r =>
        String(r.status)
          .toLowerCase() === "pending"
    );


  $("statRequests").textContent =
    pending.length;


  $("statTotalRequests").textContent =
    allRequests.length;


  renderRequests(allRequests);

  renderRecent(
    allRequests.slice(0,5)
  );


  return allRequests;

}


/* =====================================================
   RENDER REQUESTS
===================================================== */

function renderRequests(data){

  const search =
    $("requestSearch")
      .value
      .trim()
      .toLowerCase();


  let rows =
    data.filter(
      r =>
        String(r.email)
          .toLowerCase()
          .includes(search)
    );


  if(requestFilter === "pending"){

    rows =
      rows.filter(
        r =>
          String(r.status)
            .toLowerCase() === "pending"
      );

  }


  $("requestsTable").innerHTML =
    rows.length

    ?

    rows.map(
      r => {

        const status =
          String(r.status)
            .toLowerCase();


        let actions = "—";


        if(status === "pending"){

          actions = `
            <div class="actions">

              <button
                class="btn-success"
                onclick="approveRequest('${esc(r.id)}')"
              >
                ✓ Approve
              </button>

              <button
                class="btn-danger"
                onclick="rejectRequest('${esc(r.id)}')"
              >
                ✕ Reject
              </button>

            </div>
          `;

        }


        return `
          <tr>

            <td>
              ${esc(r.email)}
            </td>

            <td>
              ${badge(r.status)}
            </td>

            <td>
              ${dateText(r.created_at)}
            </td>

            <td>
              ${actions}
            </td>

          </tr>
        `;

      }
    ).join("")

    :

    `
    <tr>
      <td colspan="4" class="empty">
        ${
          requestFilter === "pending"
          ? "No pending requests."
          : "No access requests found."
        }
      </td>
    </tr>
    `;

}


/* =====================================================
   RECENT REQUESTS
===================================================== */

function renderRecent(data){

  $("recentRequests").innerHTML =
    data.length

    ?

    data.map(
      r => `
        <div
          class="status-line"
          style="
            padding:10px 0;
            border-bottom:
              1px solid rgba(255,255,255,.10)
          "
        >

          <span>
            ${esc(r.email)}
          </span>

          ${badge(r.status)}

        </div>
      `
    ).join("")

    :

    `
    <div class="empty">
      No access requests.
    </div>
    `;

}


/* =====================================================
   APPROVE REQUEST
===================================================== */

async function approveRequest(id){

  if(
    !confirm(
      "Approve this access request?"
    )
  )
    return;


  const {
    data,
    error
  } =
    await db.rpc(
      "admin_approve_access_request",
      {
        request_id:id
      }
    );


  if(error){

    console.error(
      "Approve error:",
      error
    );


    alert(
      "Unable to approve this request:\n\n"
      + error.message
    );

    return;
  }


  if(data !== true){

    alert(
      "The request could not be approved."
    );

    return;
  }


  message(
    $("requestMessage"),
    "Access approved successfully."
  );


  await Promise.all([
    loadRequests(),
    loadUsers()
  ]);

}


/* =====================================================
   REJECT REQUEST
===================================================== */

async function rejectRequest(id){

  if(
    !confirm(
      "Reject this access request?"
    )
  )
    return;


  const {
    data,
    error
  } =
    await db.rpc(
      "admin_reject_access_request",
      {
        request_id:id
      }
    );


  if(error){

    console.error(
      "Reject error:",
      error
    );


    alert(
      "Unable to reject this request:\n\n"
      + error.message
    );

    return;
  }


  if(data !== true){

    alert(
      "The request could not be rejected."
    );

    return;
  }


  message(
    $("requestMessage"),
    "Access request rejected."
  );


  await loadRequests();

}


/* =====================================================
   USERS
===================================================== */

let allUsers = [];


async function loadUsers(){

  const {
    data,
    error
  } =
    await db.rpc(
      "admin_get_approved_users"
    );


  if(error){

    console.error(
      "Users error:",
      error
    );


    $("usersTable").innerHTML =
      `
      <tr>
        <td colspan="4">
          Unable to load users.
          <br>
          ${esc(error.message)}
        </td>
      </tr>
      `;


    return [];

  }


  allUsers =
    data || [];


  $("statUsers").textContent =
    allUsers.filter(
      u =>
        String(u.status)
          .toLowerCase() === "approved"
    ).length;


  renderUsers(allUsers);


  return allUsers;

}


/* =====================================================
   RENDER USERS
===================================================== */

function renderUsers(data){

  const search =
    $("userSearch")
      .value
      .trim()
      .toLowerCase();


  const rows =
    data.filter(
      u =>
        String(u.email)
          .toLowerCase()
          .includes(search)
    );


  $("usersTable").innerHTML =
    rows.length

    ?

    rows.map(
      u => {

        const isAdmin =
          String(u.email)
            .toLowerCase()
            === ADMIN_EMAIL;


        return `
          <tr>

            <td>
              ${esc(u.email)}
            </td>

            <td>

              ${
                isAdmin

                ?

                `
                <span class="badge approved">
                  Administrator
                </span>
                `

                :

                badge(u.status)
              }

            </td>

            <td>
              ${dateText(u.created_at)}
            </td>

            <td>

              ${
                isAdmin

                ?

                "—"

                :

                `
                <button
                  class="btn-danger"
                  onclick="removeUser('${esc(u.id)}')"
                >
                  Remove Access
                </button>
                `
              }

            </td>

          </tr>
        `;

      }
    ).join("")

    :

    `
    <tr>
      <td colspan="4" class="empty">
        No users found.
      </td>
    </tr>
    `;

}


/* =====================================================
   REMOVE USER
===================================================== */

async function removeUser(id){

  if(
    !confirm(
      "Remove access for this user?"
    )
  )
    return;


  const {
    data,
    error
  } =
    await db.rpc(
      "admin_remove_approved_user",
      {
        user_id:id
      }
    );


  if(error){

    console.error(
      "Remove user error:",
      error
    );


    alert(
      "Unable to remove access:\n\n"
      + error.message
    );

    return;
  }


  if(data !== true){

    alert(
      "User access could not be removed."
    );

    return;
  }


  message(
    $("userMessage"),
    "User access removed."
  );


  await loadUsers();

}


/* =====================================================
   ADD USER
===================================================== */

$("addUserBtn").onclick =
  async () => {

    const email =
      $("newUserEmail")
        .value
        .trim()
        .toLowerCase();


    if(
      !email ||
      !email.includes("@")
    ){

      message(
        $("userMessage"),
        "Please enter a valid email address.",
        "error"
      );

      return;
    }


    if(email === ADMIN_EMAIL){

      message(
        $("userMessage"),
        "This email is already the administrator.",
        "error"
      );

      return;
    }


    const {
      data,
      error
    } =
      await db.rpc(
        "admin_add_approved_user",
        {
          user_email:email
        }
      );


    if(error){

      console.error(
        "Add user error:",
        error
      );


      message(
        $("userMessage"),
        "Unable to approve this user: "
        + error.message,
        "error"
      );

      return;
    }


    if(data !== true){

      message(
        $("userMessage"),
        "User could not be approved.",
        "error"
      );

      return;
    }


    $("newUserEmail").value = "";


    message(
      $("userMessage"),
      "User approved successfully."
    );


    await loadUsers();

  };


/* =====================================================
   VIDEOS
===================================================== */

let allVideos = [];


async function loadVideos(){

  const {
    data,
    error
  } =
    await db
      .from("videos")
      .select(
        "id,title,youtube_url,created_at"
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(error){

    console.error(
      "Videos error:",
      error
    );


    $("videosList").innerHTML =
      `
      <div class="message error">
        Unable to load videos.
        <br>
        ${esc(error.message)}
      </div>
      `;


    return [];

  }


  allVideos =
    data || [];


  $("statVideos").textContent =
    allVideos.length;


  renderVideos(allVideos);


  return allVideos;

}


/* =====================================================
   RENDER VIDEOS
===================================================== */

function renderVideos(data){

  const search =
    $("videoSearch")
      .value
      .trim()
      .toLowerCase();


  const rows =
    data.filter(
      v =>
        (
          String(v.title)
          + " "
          + String(v.youtube_url)
        )
        .toLowerCase()
        .includes(search)
    );


  $("videosList").innerHTML =
    rows.length

    ?

    rows.map(
      v => `
        <div class="video-card">

          <div class="video-title">
            🎬 ${esc(v.title)}
          </div>

          <div class="url">
            ${esc(v.youtube_url)}
          </div>

          <div class="muted">
            ${dateText(v.created_at)}
          </div>

          <div
            class="actions"
            style="margin-top:10px"
          >

            <button
              class="btn-primary"
              onclick="editVideo('${esc(v.id)}')"
            >
              ✏️ Edit
            </button>

            <button
              class="btn-danger"
              onclick="deleteVideo('${esc(v.id)}')"
            >
              🗑️ Delete
            </button>

          </div>

        </div>
      `
    ).join("")

    :

    `
    <div class="empty">
      No videos found.
    </div>
    `;

}


/* =====================================================
   ADD VIDEO
===================================================== */

$("addVideoBtn").onclick =
  async () => {

    const title =
      $("videoTitle")
        .value
        .trim();


    const url =
      $("videoUrl")
        .value
        .trim();


    if(!title || !url){

      message(
        $("videoMessage"),
        "Enter the video title and YouTube link.",
        "error"
      );

      return;
    }


    const {
      error
    } =
      await db
        .from("videos")
        .insert({
          title,
          youtube_url:url
        });


    if(error){

      console.error(
        "Add video error:",
        error
      );


      message(
        $("videoMessage"),
        "Unable to add video: "
        + error.message,
        "error"
      );

      return;
    }


    $("videoTitle").value = "";

    $("videoUrl").value = "";


    message(
      $("videoMessage"),
      "Video added successfully."
    );


    await loadVideos();

  };


/* =====================================================
   EDIT VIDEO
===================================================== */

async function editVideo(id){

  const {
    data,
    error
  } =
    await db
      .from("videos")
      .select(
        "title,youtube_url"
      )
      .eq("id",id)
      .single();


  if(error){

    alert(
      "Unable to load video."
    );

    return;
  }


  const title =
    prompt(
      "Video title:",
      data.title
    );


  if(title === null)
    return;


  const url =
    prompt(
      "YouTube link:",
      data.youtube_url
    );


  if(url === null)
    return;


  if(
    !title.trim() ||
    !url.trim()
  ){

    alert(
      "Title and URL cannot be empty."
    );

    return;
  }


  const {
    error:e
  } =
    await db
      .from("videos")
      .update({
        title:title.trim(),
        youtube_url:url.trim()
      })
      .eq("id",id);


  if(e){

    console.error(e);

    alert(
      "Unable to update video."
    );

    return;
  }


  await loadVideos();

}


/* =====================================================
   DELETE VIDEO
===================================================== */

async function deleteVideo(id){

  if(
    !confirm(
      "Delete this video?"
    )
  )
    return;


  const {
    error
  } =
    await db
      .from("videos")
      .delete()
      .eq("id",id);


  if(error){

    console.error(error);

    alert(
      "Unable to delete video:\n\n"
      + error.message
    );

    return;
  }


  await loadVideos();

}


/* =====================================================
   REFRESH ALL
===================================================== */

async function refreshAll(){

  $("systemStatus").innerHTML =
    `
    <div class="message">
      Loading system...
    </div>
    `;


  await Promise.all([
    loadRequests(),
    loadUsers(),
    loadVideos()
  ]);


  $("systemStatus").innerHTML = `

    <div class="message success">
      ✓ Supabase authentication is active.
    </div>

    <div class="message success">
      ✓ Admin authorization is active.
    </div>

    <div class="message success">
      ✓ Access request system is active.
    </div>

    <div class="message success">
      ✓ Approved users management is active.
    </div>

    <div class="message success">
      ✓ YouTube video management is active.
    </div>

  `;

}


/* =====================================================
   PAGE NAVIGATION
===================================================== */

function showPage(page){

  document
    .querySelectorAll(".page")
    .forEach(
      x =>
        x.classList.add("hidden")
    );


  $(page + "Page")
    .classList
    .remove("hidden");


  document
    .querySelectorAll(".nav-btn")
    .forEach(
      x =>
        x.classList.toggle(
          "active",
          x.dataset.page === page
        )
    );


  $("sidebar")
    .classList
    .remove("open");


  if(page === "requests")
    loadRequests();


  if(page === "users")
    loadUsers();


  if(page === "videos")
    loadVideos();

}


/* =====================================================
   NAVIGATION EVENTS
===================================================== */

document
  .querySelectorAll(".nav-btn")
  .forEach(
    b =>
      b.onclick =
        () =>
          showPage(
            b.dataset.page
          )
  );


$("mobileMenu").onclick =
  () =>
    $("sidebar")
      .classList
      .toggle("open");


/* =====================================================
   REFRESH BUTTONS
===================================================== */

$("dashboardRefresh").onclick =
  refreshAll;


$("refreshRequests").onclick =
  loadRequests;


$("refreshUsers").onclick =
  loadUsers;


$("refreshVideos").onclick =
  loadVideos;


/* =====================================================
   REQUEST SEARCH
===================================================== */

$("requestSearch").oninput =
  () =>
    renderRequests(
      allRequests
    );


$("showPendingBtn").onclick =
  () => {

    requestFilter =
      "pending";

    renderRequests(
      allRequests
    );

  };


$("showAllBtn").onclick =
  () => {

    requestFilter =
      "all";

    renderRequests(
      allRequests
    );

  };


/* =====================================================
   USER SEARCH
===================================================== */

$("userSearch").oninput =
  () =>
    renderUsers(
      allUsers
    );


/* =====================================================
   VIDEO SEARCH
===================================================== */

$("videoSearch").oninput =
  () =>
    renderVideos(
      allVideos
    );


/* =====================================================
   LOGOUT
===================================================== */

$("logoutBtn").onclick =
  async () => {

    await db.auth.signOut();

    location.reload();

  };


/* =====================================================
   AUTO LOGIN
===================================================== */

(async () => {

  const {
    data
  } =
    await db.auth.getSession();


  const session =
    data?.session;


  if(!session)
    return;


  const email =
    session.user?.email
      ?.trim()
      .toLowerCase();


  if(email !== ADMIN_EMAIL){

    await db.auth.signOut();

    return;
  }


  const isAdmin =
    await checkAdmin();


  if(!isAdmin){

    await db.auth.signOut();

    return;
  }


  $("adminName").textContent =
    email;


  $("loginScreen")
    .classList
    .add("hidden");


  $("app")
    .classList
    .remove("hidden");


  await refreshAll();

})();

</script>
