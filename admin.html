<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

"use strict";

/* =====================================================
   ERADA ADMIN
===================================================== */

if (typeof window.supabase === "undefined") {
    console.error("Supabase library not loaded.");
    alert("Supabase library could not be loaded.");
    return;
}


/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://laqwnqnnqtfhqfadjyvo.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_ropVS738K5BJiOoaZ-TeWA_WmkineZh";

const ADMIN_EMAIL =
    "it@erada.ly";


const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


/* =====================================================
   HELPERS
===================================================== */

const $ = id => document.getElementById(id);


const esc = value =>
    String(value ?? "")
        .replace(/[&<>"']/g, c => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
        }[c]));


const dateText = value =>
    value
        ? new Date(value).toLocaleString()
        : "—";


function setText(id, value) {
    const el = $(id);
    if (el) el.textContent = value;
}


function setHTML(id, value) {
    const el = $(id);
    if (el) el.innerHTML = value;
}


function message(el, text, type = "success") {

    if (!el) return;

    el.innerHTML = `
        <div class="message ${type}">
            ${esc(text)}
        </div>
    `;
}


function badge(status) {

    const clean =
        String(status || "")
            .toLowerCase();

    return `
        <span class="badge ${esc(clean)}">
            ${esc(status || "unknown")}
        </span>
    `;
}


/* =====================================================
   ADMIN CHECK
===================================================== */

async function checkAdmin() {

    try {

        const { data, error } =
            await db.rpc("is_admin");

        if (error) {
            console.error("Admin check:", error);
            return false;
        }

        return data === true;

    } catch (err) {

        console.error("Admin check exception:", err);
        return false;
    }
}


/* =====================================================
   LOGIN
===================================================== */

async function login() {

    const emailEl = $("adminEmail");
    const passwordEl = $("adminPassword");

    if (!emailEl || !passwordEl) {
        console.error("Login elements not found.");
        return;
    }

    const email =
        emailEl.value
            .trim()
            .toLowerCase();

    const password =
        passwordEl.value;


    if (email !== ADMIN_EMAIL) {

        message(
            $("loginMessage"),
            "Only IT@erada.ly can access the admin panel.",
            "error"
        );

        return;
    }


    if (!password) {

        message(
            $("loginMessage"),
            "Please enter your password.",
            "error"
        );

        return;
    }


    message(
        $("loginMessage"),
        "Signing in..."
    );


    try {

        const { data, error } =
            await db.auth.signInWithPassword({
                email,
                password
            });


        if (error) {

            console.error("Login error:", error);

            message(
                $("loginMessage"),
                error.message || "Invalid email or password.",
                "error"
            );

            return;
        }


        const isAdmin =
            await checkAdmin();


        if (!isAdmin) {

            await db.auth.signOut();

            message(
                $("loginMessage"),
                "You are not authorized to access the admin panel.",
                "error"
            );

            return;
        }


        setText(
            "adminName",
            data.user?.email || ADMIN_EMAIL
        );


        const loginScreen = $("loginScreen");
        const app = $("app");

        if (loginScreen)
            loginScreen.classList.add("hidden");

        if (app)
            app.classList.remove("hidden");


        await refreshAll();

    } catch (err) {

        console.error("Login exception:", err);

        message(
            $("loginMessage"),
            "Login failed. Please try again.",
            "error"
        );
    }
}


/* =====================================================
   FORGOT PASSWORD
===================================================== */

async function forgotPassword() {

    const emailEl = $("adminEmail");

    if (!emailEl) return;

    const email =
        emailEl.value
            .trim()
            .toLowerCase();


    if (email !== ADMIN_EMAIL) {

        message(
            $("loginMessage"),
            "Enter IT@erada.ly first.",
            "error"
        );

        return;
    }


    try {

        const { error } =
            await db.auth.resetPasswordForEmail(
                email,
                {
                    redirectTo:
                        "https://eradavideos.github.io/reset-password.html"
                }
            );


        if (error) {

            console.error(error);

            message(
                $("loginMessage"),
                error.message || "Unable to send recovery email.",
                "error"
            );

            return;
        }


        message(
            $("loginMessage"),
            "Password recovery link has been sent."
        );

    } catch (err) {

        console.error(err);

        message(
            $("loginMessage"),
            "Unable to send recovery email.",
            "error"
        );
    }
}


/* =====================================================
   ACCESS REQUESTS
===================================================== */

let allRequests = [];
let requestFilter = "all";


async function loadRequests() {

    try {

        const { data, error } =
            await db.rpc(
                "admin_get_access_requests"
            );


        if (error) {

            console.error("Requests error:", error);

            setHTML(
                "requestsTable",
                `
                <tr>
                    <td colspan="4">
                        Unable to load access requests.
                        <br><br>
                        ${esc(error.message)}
                    </td>
                </tr>
                `
            );

            return [];
        }


        allRequests = data || [];


        const pending =
            allRequests.filter(
                r =>
                    String(r.status || "")
                        .toLowerCase() === "pending"
            );


        setText(
            "statRequests",
            pending.length
        );

        setText(
            "statTotalRequests",
            allRequests.length
        );


        renderRequests(allRequests);
        renderRecent(allRequests.slice(0, 5));

        return allRequests;

    } catch (err) {

        console.error("Load requests exception:", err);
        return [];
    }
}


/* =====================================================
   RENDER REQUESTS
===================================================== */

function renderRequests(data) {

    const searchEl = $("requestSearch");

    const search =
        searchEl
            ? searchEl.value.trim().toLowerCase()
            : "";


    let rows =
        (data || []).filter(
            r =>
                String(r.email || "")
                    .toLowerCase()
                    .includes(search)
        );


    if (requestFilter === "pending") {

        rows =
            rows.filter(
                r =>
                    String(r.status || "")
                        .toLowerCase() === "pending"
            );
    }


    if (!$("requestsTable")) return;


    $("requestsTable").innerHTML =
        rows.length
            ? rows.map(r => {

                const status =
                    String(r.status || "")
                        .toLowerCase();

                let actions = "—";


                if (status === "pending") {

                    actions = `
                        <div class="actions">

                            <button
                                class="btn-success"
                                onclick="approveRequest('${esc(r.id)}')"
                            >
                                ✓ Approve
                            </button>

                            <button
                                class="btn-danger"
                                onclick="rejectRequest('${esc(r.id)}')"
                            >
                                ✕ Reject
                            </button>

                        </div>
                    `;
                }


                return `
                    <tr>

                        <td>
                            ${esc(r.email)}
                        </td>

                        <td>
                            ${badge(r.status)}
                        </td>

                        <td>
                            ${dateText(r.created_at)}
                        </td>

                        <td>
                            ${actions}
                        </td>

                    </tr>
                `;

            }).join("")

            :

            `
                <tr>
                    <td colspan="4" class="empty">
                        ${
                            requestFilter === "pending"
                                ? "No pending requests."
                                : "No access requests found."
                        }
                    </td>
                </tr>
            `;
}


/* =====================================================
   RECENT
===================================================== */

function renderRecent(data) {

    if (!$("recentRequests")) return;


    $("recentRequests").innerHTML =
        data.length

            ? data.map(r => `
                <div
                    class="status-line"
                    style="
                        padding:10px 0;
                        border-bottom:
                        1px solid rgba(255,255,255,.10)
                    "
                >

                    <span>
                        ${esc(r.email)}
                    </span>

                    ${badge(r.status)}

                </div>
            `).join("")

            :

            `
                <div class="empty">
                    No access requests.
                </div>
            `;
}


/* =====================================================
   APPROVE REQUEST
===================================================== */

async function approveRequest(id) {

    if (!confirm("Approve this access request?"))
        return;


    try {

        const { data, error } =
            await db.rpc(
                "admin_approve_access_request",
                {
                    request_id: id
                }
            );


        if (error) {

            console.error(error);

            alert(
                "Unable to approve this request:\n\n" +
                error.message
            );

            return;
        }


        if (data !== true) {

            alert("The request could not be approved.");

            return;
        }


        message(
            $("requestMessage"),
            "Access approved successfully."
        );


        await loadRequests();
        await loadUsers();

    } catch (err) {

        console.error(err);

        alert("Unable to approve this request.");
    }
}


/* =====================================================
   REJECT REQUEST
===================================================== */

async function rejectRequest(id) {

    if (!confirm("Reject this access request?"))
        return;


    try {

        const { data, error } =
            await db.rpc(
                "admin_reject_access_request",
                {
                    request_id: id
                }
            );


        if (error) {

            console.error(error);

            alert(
                "Unable to reject this request:\n\n" +
                error.message
            );

            return;
        }


        if (data !== true) {

            alert("The request could not be rejected.");

            return;
        }


        message(
            $("requestMessage"),
            "Access request rejected."
        );


        await loadRequests();

    } catch (err) {

        console.error(err);
    }
}


/* =====================================================
   USERS
===================================================== */

let allUsers = [];


async function loadUsers() {

    try {

        const { data, error } =
            await db
                .from("approved_users")
                .select(
                    "id,email,status,created_at"
                )
                .order(
                    "email",
                    {
                        ascending: true
                    }
                );


        if (error) {

            console.error("Users error:", error);

            setHTML(
                "usersTable",
                `
                <tr>
                    <td colspan="4">
                        Unable to load users.
                        <br><br>
                        ${esc(error.message)}
                    </td>
                </tr>
                `
            );

            return [];
        }


        allUsers = data || [];


        const approved =
            allUsers.filter(
                u =>
                    String(u.status || "")
                        .toLowerCase() === "approved"
            );


        setText(
            "statUsers",
            approved.length
        );


        renderUsers(allUsers);

        return allUsers;

    } catch (err) {

        console.error("Load users exception:", err);

        return [];
    }
}


/* =====================================================
   RENDER USERS
===================================================== */

function renderUsers(data) {

    const searchEl = $("userSearch");

    const search =
        searchEl
            ? searchEl.value.trim().toLowerCase()
            : "";


    const rows =
        (data || []).filter(
            u =>
                String(u.email || "")
                    .toLowerCase()
                    .includes(search)
        );


    if (!$("usersTable")) return;


    $("usersTable").innerHTML =
        rows.length

            ? rows.map(u => {

                const isAdmin =
                    String(u.email || "")
                        .toLowerCase() === ADMIN_EMAIL;


                return `
                    <tr>

                        <td>
                            ${esc(u.email)}
                        </td>

                        <td>

                            ${
                                isAdmin
                                    ?

                                    `
                                    <span class="badge approved">
                                        Administrator
                                    </span>
                                    `

                                    :

                                    badge(u.status)
                            }

                        </td>

                        <td>
                            ${dateText(u.created_at)}
                        </td>

                        <td>

                            ${
                                isAdmin
                                    ?

                                    "—"

                                    :

                                    `
                                    <button
                                        class="btn-danger"
                                        onclick="removeUser('${esc(u.id)}')"
                                    >
                                        Remove Access
                                    </button>
                                    `
                            }

                        </td>

                    </tr>
                `;

            }).join("")

            :

            `
                <tr>
                    <td colspan="4" class="empty">
                        No users found.
                    </td>
                </tr>
            `;
}


/* =====================================================
   REMOVE USER
===================================================== */

async function removeUser(id) {

    if (!confirm("Remove access for this user?"))
        return;


    try {

        const { error } =
            await db
                .from("approved_users")
                .delete()
                .eq("id", id);


        if (error) {

            console.error(error);

            alert(
                "Unable to remove access:\n\n" +
                error.message
            );

            return;
        }


        message(
            $("userMessage"),
            "User access removed."
        );


        await loadUsers();

    } catch (err) {

        console.error(err);
    }
}


/* =====================================================
   ADD USER
===================================================== */

async function addUser() {

    const input = $("newUserEmail");

    if (!input) return;


    const email =
        input.value
            .trim()
            .toLowerCase();


    if (!email || !email.includes("@")) {

        message(
            $("userMessage"),
            "Please enter a valid email address.",
            "error"
        );

        return;
    }


    if (email === ADMIN_EMAIL) {

        message(
            $("userMessage"),
            "This email is already the administrator.",
            "error"
        );

        return;
    }


    try {

        const { error } =
            await db
                .from("approved_users")
                .upsert(
                    {
                        email: email,
                        status: "approved"
                    },
                    {
                        onConflict: "email"
                    }
                );


        if (error) {

            console.error(error);

            message(
                $("userMessage"),
                "Unable to approve this user: " +
                error.message,
                "error"
            );

            return;
        }


        input.value = "";


        message(
            $("userMessage"),
            "User approved successfully."
        );


        await loadUsers();

    } catch (err) {

        console.error(err);

        message(
            $("userMessage"),
            "Unable to approve this user.",
            "error"
        );
    }
}


/* =====================================================
   VIDEOS
===================================================== */

let allVideos = [];


async function loadVideos() {

    try {

        const { data, error } =
            await db
                .from("videos")
                .select(
                    "id,title,youtube_url,created_at"
                )
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


        if (error) {

            console.error("Videos error:", error);

            setHTML(
                "videosList",
                `
                <div class="message error">
                    Unable to load videos.
                    <br><br>
                    ${esc(error.message)}
                </div>
                `
            );

            return [];
        }


        allVideos = data || [];


        setText(
            "statVideos",
            allVideos.length
        );


        renderVideos(allVideos);

        return allVideos;

    } catch (err) {

        console.error(err);

        return [];
    }
}


/* =====================================================
   RENDER VIDEOS
===================================================== */

function renderVideos(data) {

    const searchEl = $("videoSearch");

    const search =
        searchEl
            ? searchEl.value.trim().toLowerCase()
            : "";


    const rows =
        (data || []).filter(
            v =>
                (
                    String(v.title || "") +
                    " " +
                    String(v.youtube_url || "")
                )
                .toLowerCase()
                .includes(search)
        );


    if (!$("videosList")) return;


    $("videosList").innerHTML =
        rows.length

            ? rows.map(v => `
                <div class="video-card">

                    <div class="video-title">
                        🎬 ${esc(v.title)}
                    </div>

                    <div class="url">
                        ${esc(v.youtube_url)}
                    </div>

                    <div class="muted">
                        ${dateText(v.created_at)}
                    </div>

                    <div
                        class="actions"
                        style="margin-top:10px"
                    >

                        <button
                            class="btn-primary"
                            onclick="editVideo('${esc(v.id)}')"
                        >
                            ✏️ Edit
                        </button>

                        <button
                            class="btn-danger"
                            onclick="deleteVideo('${esc(v.id)}')"
                        >
                            🗑️ Delete
                        </button>

                    </div>

                </div>
            `).join("")

            :

            `
                <div class="empty">
                    No videos found.
                </div>
            `;
}


/* =====================================================
   ADD VIDEO
===================================================== */

async function addVideo() {

    const titleEl = $("videoTitle");
    const urlEl = $("videoUrl");

    if (!titleEl || !urlEl)
        return;


    const title =
        titleEl.value.trim();

    const url =
        urlEl.value.trim();


    if (!title || !url) {

        message(
            $("videoMessage"),
            "Enter the video title and YouTube link.",
            "error"
        );

        return;
    }


    try {

        const { error } =
            await db
                .from("videos")
                .insert({
                    title: title,
                    youtube_url: url
                });


        if (error) {

            console.error(error);

            message(
                $("videoMessage"),
                "Unable to add video: " +
                error.message,
                "error"
            );

            return;
        }


        titleEl.value = "";
        urlEl.value = "";


        message(
            $("videoMessage"),
            "Video added successfully."
        );


        await loadVideos();

    } catch (err) {

        console.error(err);
    }
}


/* =====================================================
   EDIT VIDEO
===================================================== */

async function editVideo(id) {

    try {

        const { data, error } =
            await db
                .from("videos")
                .select(
                    "title,youtube_url"
                )
                .eq("id", id)
                .single();


        if (error) {

            alert(
                "Unable to load video:\n\n" +
                error.message
            );

            return;
        }


        const title =
            prompt(
                "Video title:",
                data.title
            );


        if (title === null)
            return;


        const url =
            prompt(
                "YouTube link:",
                data.youtube_url
            );


        if (url === null)
            return;


        if (!title.trim() || !url.trim()) {

            alert(
                "Title and URL cannot be empty."
            );

            return;
        }


        const { error: updateError } =
            await db
                .from("videos")
                .update({
                    title: title.trim(),
                    youtube_url: url.trim()
                })
                .eq("id", id);


        if (updateError) {

            alert(
                "Unable to update video:\n\n" +
                updateError.message
            );

            return;
        }


        await loadVideos();

    } catch (err) {

        console.error(err);
    }
}


/* =====================================================
   DELETE VIDEO
===================================================== */

async function deleteVideo(id) {

    if (!confirm("Delete this video?"))
        return;


    try {

        const { error } =
            await db
                .from("videos")
                .delete()
                .eq("id", id);


        if (error) {

            alert(
                "Unable to delete video:\n\n" +
                error.message
            );

            return;
        }


        await loadVideos();

    } catch (err) {

        console.error(err);
    }
}

   REFRESH

/* =====================================================
   NAVIGATION
===================================================== */

function showPage(page) {

    document
        .querySelectorAll(".page")
        .forEach(
            x =>
                x.classList.add("hidden")
        );


    const target =
        $(page + "Page");


    if (target)
        target.classList.remove("hidden");


    document
        .querySelectorAll(".nav-btn")
        .forEach(
            x =>
                x.classList.toggle(
                    "active",
                    x.dataset.page === page
                )
        );


    const sidebar = $("sidebar");

    if (sidebar)
        sidebar.classList.remove("open");


    if (page === "requests")
        loadRequests();

    if (page === "users")
        loadUsers();

    if (page === "videos")
        loadVideos();
}

/* =====================================================
   GLOBAL FUNCTIONS
===================================================== */

window.approveRequest =
    approveRequest;

/* =====================================================
   AUTO LOGIN
===================================================== */

(async function () {

    try {

        const { data, error } =
            await db.auth.getSession();


        if (error) {

            console.error(
                "Session error:",
                error
            );

            return;
        }


        const session =
            data?.session;


        if (!session)
            return;


        const email =
            session.user?.email
                ?.trim()
                .toLowerCase();


        if (email !== ADMIN_EMAIL) {

            await db.auth.signOut();

            return;
        }


        const isAdmin =
            await checkAdmin();


        if (!isAdmin) {

            await db.auth.signOut();

            return;
        }


        setText(
            "adminName",
            email
        );


        const loginScreen =
            $("loginScreen");

        const app =
            $("app");


        if (loginScreen)
            loginScreen.classList.add("hidden");


        if (app)
            app.classList.remove("hidden");


        await refreshAll();

    } catch (err) {

        console.error(
            "Auto login error:",
            err
        );
    }

})();

});
</script>
