<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ERADA - Reset Password</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      text-align: center;
      padding: 30px;
    }

    header h1 {
      margin: 0;
    }

    .container {
      max-width: 450px;
      margin: 60px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 25px;
      box-shadow: 0 3px 14px #0001;
    }

    h2 {
      margin-top: 0;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: 0;
      border-radius: 8px;
      background: #111827;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #message {
      margin-top: 15px;
      padding: 10px;
      border-radius: 8px;
      display: none;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

  </style>

</head>

<body>

  <header>

    <h1>ERADA</h1>

    <p>Admin Password Reset</p>

  </header>


  <main class="container">

    <div class="card">

      <h2>Set New Password</h2>

      <p>
        Enter a new password for your Admin account.
      </p>

      <input
        id="password"
        type="password"
        placeholder="New password"
        autocomplete="new-password"
      >

      <input
        id="confirmPassword"
        type="password"
        placeholder="Confirm new password"
        autocomplete="new-password"
      >

      <button id="updatePassword">
        Update Password
      </button>

      <div id="message"></div>

    </div>

  </main>


  <script>

    const SUPABASE_URL =
      "https://laqwnqnnqtfhqfadjyvo.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_ropVS738K5BJiOoaZ-TeWA_WmkineZh";


    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    const password =
      document.getElementById("password");

    const confirmPassword =
      document.getElementById("confirmPassword");

    const message =
      document.getElementById("message");


    function showMessage(text, type) {

      message.textContent = text;

      message.className = type;

      message.style.display = "block";

    }


    document
      .getElementById("updatePassword")
      .addEventListener("click", async function () {

        const newPassword =
          password.value;

        const confirm =
          confirmPassword.value;


        if (!newPassword || !confirm) {

          showMessage(
            "Please enter and confirm your new password.",
            "error"
          );

          return;

        }


        if (newPassword.length < 8) {

          showMessage(
            "Password must be at least 8 characters.",
            "error"
          );

          return;

        }


        if (newPassword !== confirm) {

          showMessage(
            "Passwords do not match.",
            "error"
          );

          return;

        }


        showMessage(
          "Updating password...",
          "success"
        );


        const { error } =
          await supabaseClient.auth.updateUser({

            password: newPassword

          });


        if (error) {

          console.error(error);

          showMessage(
            error.message,
            "error"
          );

          return;

        }


        showMessage(
          "Password updated successfully. You can now use your Admin password to sign in.",
          "success"
        );


        setTimeout(function () {

          window.location.href =
            "/admin.html";

        }, 2500);

      });

  </script>

</body>

</html>
